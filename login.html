<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>云盘账号登录 · 抓令牌</title>
<style>
:root{--pri:#3181f9;--ok:#18a058;--err:#e54545;--sub:#8a9099;--bd:#e6e8eb}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#1f2329;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px;max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:17px;margin:0 0 3px}
.sub{font-size:12.5px;color:var(--sub);margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:10px;font-size:17px;outline:none}
input:focus{border-color:var(--pri)}
.row{display:flex;gap:9px}
.row input{flex:1}
button{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;margin-top:12px}
button:disabled{opacity:.5}
button.sm{width:auto;padding:13px 18px;margin-top:0;flex-shrink:0}
button.ghost{background:#f0f2f5;color:#1f2329;font-weight:500}
#msg{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13.5px;display:none;background:#f0f9f1;color:#18a058}
#msg.bad{background:#fdf0f0;color:var(--err)}
#log{margin-top:12px;background:#1f2329;color:#d8dee6;border-radius:10px;padding:12px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,monospace;max-height:280px;overflow:auto;display:none}
.ok{color:#7ee787}.err{color:#ff9b9b}.warn{color:#ffd479}
details{margin-top:10px;font-size:13px}
summary{cursor:pointer;color:var(--pri);padding:6px 0}
textarea{width:100%;min-height:70px;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin-top:7px}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <div class="gicon">🔒</div>
    <h2>云盘托管</h2>
    <p class="gtip">请输入进入口令</p>
    <input id="gp" type="password" placeholder="口令" autocomplete="off">
    <button id="go">进入</button>
    <div id="gmsg"></div>
  </div>
</div>
<style>
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1f2a44,#2b3a5c);display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.gicon{font-size:38px;margin-bottom:6px}
.gbox h2{margin:0 0 4px;font-size:19px;color:#1f2329}
.gtip{margin:0 0 16px;font-size:13px;color:#8a9099}
.gbox input{width:100%;padding:13px 14px;border:1px solid #e6e8eb;border-radius:10px;font-size:17px;outline:none;text-align:center}
.gbox input:focus{border-color:#3181f9}
.gbox button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;background:#3181f9;color:#fff}
#gmsg{margin-top:10px;font-size:13px;color:#e54545;display:none}
#gmsg.on{display:block}
#app{display:none}
#app.on{display:block}
</style>
<script>
(function(){
  var GS = "b4da85f2e9946a3a605f1a5602b06e29381207d1b22ab7bb66d57d376ce0a625";
  var $ = function(i){ return document.getElementById(i); };
  function sha256(s){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))
      .then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); });
  }
  function show(){
    $("gate").style.display = "none";
    var a = $("app"); if (a) a.className = "on";
  }
  if (sessionStorage.getItem("gate_ok") === "1") { show(); }
  $("go").onclick = function(){
    var v = $("gp").value;
    if (!v) { var m=$("gmsg"); m.textContent="请输入口令"; m.className="on"; return; }
    sha256(v).then(function(h){
      if (h === GS){ sessionStorage.setItem("gate_ok","1"); show(); }
      else { var m=$("gmsg"); m.textContent="口令不对"; m.className="on"; $("gp").value=""; }
    });
  };
  $("gp").addEventListener("keydown", function(e){ if (e.key === "Enter") $("go").click(); });
})();
</script>

<div id="app">

<div class="card">
<h1>云盘账号登录 · 抓令牌</h1>
<div class="sub">输手机号 → 收验证码 → 自动抓令牌入库，之后每天自动签到</div>

<label>手机号</label>
<div class="row">
  <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号">
  <button id="btn_code" class="sm">获取验证码</button>
</div>

<label>短信验证码</label>
<input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="收到的验证码">

<button id="btn_login">登录并抓取令牌</button>
<button id="btn_host" class="ghost">开始托管签到（每天自动跑）</button>
<div id="msg"></div>
<div id="log"></div>
</div>

<div class="card">
<details>
<summary>方式 B：手机浏览器登录后粘贴会话（遇风控时用）</summary>
<div class="hint">在你手机浏览器打开 mail.10086.cn 登录，然后粘贴会话串：</div>
<textarea id="sid" placeholder="粘贴 JSESSIONID 或完整 cookie"></textarea>
<button id="btn_b" class="ghost">用会话抓令牌</button>
</details>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var REPO = "WoShiYiGeManHuaJia/yun139-ghpanel";
var TK_BLOB = "nxMLfZ4ESmjkhi5Eo5b0NtTBCAV5qwA85aU/d7jFHEMt6elFKtWbjIHrNqoOBUvGPIJ26XaiMhvuTTY+m8muSB3zI5M=";
var PASS = "nexio-2026-panel";

function log(s,cls){ var d=document.createElement("div"); if(cls)d.className=cls; d.textContent=s; var e=$("log"); e.appendChild(d); e.style.display="block"; e.scrollTop=e.scrollHeight; }
function msg(t,bad){ var e=$("msg"); e.textContent=t; e.style.display="block"; e.className=bad?"bad":""; }
function busy(b){ var a=["btn_code","btn_login","btn_b","btn_host"]; for(var i=0;i<a.length;i++) $(a[i]).disabled=b; }

var TOKEN = null;

async function unlock(){
  if (!window.crypto || !crypto.subtle){
    msg("当前不是 https 页面，浏览器禁用了加密功能，请用 https 地址打开。", true); return false;
  }
  try{
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(PASS), "PBKDF2", false, ["deriveKey"]);
    var d = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("yun139salt"))).slice(0,16);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:d,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var raw = new Uint8Array(atob(TK_BLOB).split("").map(function(c){return c.charCodeAt(0);}));
    var dec = await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)}, key, raw.slice(12));
    TOKEN = new TextDecoder().decode(dec);
    return true;
  }catch(e){ msg("密钥解出失败："+e.message, true); return false; }
}

async function api(path, opts){
  var o = opts || {};
  o.headers = { "Authorization":"token "+TOKEN, "Accept":"application/vnd.github+json",
                "Content-Type":"application/json", "User-Agent":"yun139-panel" };
  return fetch("https://api.github.com"+path, o);
}

async function dispatch(type, payload){
  var r = await api("/repos/"+REPO+"/dispatches", { method:"POST", body: JSON.stringify({event_type:type, client_payload:payload||{}}) });
  if (!r.ok) throw new Error("触发失败 HTTP "+r.status);
  return true;
}

async function readResult(prevSha){
  var r = await api("/repos/"+REPO+"/contents/data/result.json?ref=main");
  if (!r.ok) throw new Error("读取结果失败 HTTP "+r.status);
  var j = await r.json();
  if (j.sha === prevSha) return null;
  try {
    var txt = decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))));
    return { sha:j.sha, data:JSON.parse(txt) };
  }catch(e){ return { sha:j.sha, raw:"(结果不是 JSON)" }; }
}

async function waitResult(label){
  var prev = null;
  try { var b = await api("/repos/"+REPO+"/contents/data/result.json?ref=main"); if (b.ok){ var bj = await b.json(); prev = bj.sha; } } catch(e){}
  for (var i=0;i<20;i++){
    await new Promise(function(s){ setTimeout(s,9000); });
    var p = null;
    try { p = await readResult(prev); } catch(e){ continue; }
    if (p){
      log(label+" 有结果了", "ok");
      log(JSON.stringify(p.data||p.raw).slice(0,700));
      return p;
    }
    log("等待结果… "+(i+1)+"/20");
  }
  log("超时未拿到新结果，请到仓库看 data/result.json", "warn");
  return null;
}

$("btn_code").onclick = async function(){
  var phone = $("phone").value.trim();
  if (!/^1\d{10}$/.test(phone)){ msg("请输入 11 位手机号", true); return; }
  if (!TOKEN && !(await unlock())) return;
  busy(true); msg("正在发送验证码…");
  try{
    await dispatch("send_code", { phone: phone });
    msg("验证码已发送，请查收短信");
    log("send_code 已触发 → "+phone, "ok");
    await waitResult("发码");
  }catch(e){ msg("发送失败："+e.message, true); log("失败："+e.message,"err"); }
  busy(false);
};

$("btn_login").onclick = async function(){
  var phone = $("phone").value.trim(), code = $("code").value.trim();
  if (!/^1\d{10}$/.test(phone)){ msg("请输入 11 位手机号", true); return; }
  if (!code){ msg("请输入验证码", true); return; }
  if (!TOKEN && !(await unlock())) return;
  busy(true); msg("正在登录并抓取令牌…");
  try{
    await dispatch("do_login", { phone: phone, code: code });
    log("do_login 已触发（"+phone.replace(/(\d{3})\d{4}(\d{4})/,"$1****$2")+"）", "ok");
    await waitResult("登录");
    msg("已提交，请看上方日志确认是否抓到令牌");
  }catch(e){ msg("登录失败："+e.message, true); log("失败："+e.message,"err"); }
  busy(false);
};

$("btn_host").onclick = async function(){
  var phone = $("phone").value.trim();
  if (!/^1\d{10}$/.test(phone)){ msg("请输入 11 位手机号", true); return; }
  if (!TOKEN && !(await unlock())) return;
  busy(true); msg("正在启动托管…");
  try{
    await dispatch("daily", { phone: phone });
    log("daily 已触发（"+phone.replace(/(\d{3})\d{4}(\d{4})/,"$1****$2")+"）", "ok");
    log("签到 + 做任务 + 领气泡，约需 1-3 分钟", "warn");
    await waitResult("托管");
    msg("已完成一轮，之后每天自动跑");
  }catch(e){ msg("托管失败："+e.message, true); log("失败："+e.message,"err"); }
  busy(false);
};

$("btn_b").onclick = async function(){
  var sid = $("sid").value.trim(), phone = $("phone").value.trim();
  if (!sid){ msg("请粘贴会话串", true); return; }
  if (!TOKEN && !(await unlock())) return;
  busy(true); msg("正在用会话抓令牌…");
  try{
    await dispatch("do_login", { phone: phone, sid: sid });
    await waitResult("抓令牌");
    msg("已提交，请看上方日志");
  }catch(e){ msg("失败："+e.message, true); log("失败："+e.message,"err"); }
  busy(false);
};

log("就绪。填入手机号即可开始。");
</script>
</div>
</body>
</html>
