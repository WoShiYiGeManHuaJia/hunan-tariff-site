<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国电信资费专区</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#12233b;padding-bottom:40px}
  .topbar{background:linear-gradient(120deg,#002b67,#0a63c9);color:#fff;padding:18px 16px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{width:40px;height:40px;border-radius:50%;background:#fff;color:#003b87;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .brand-text strong{font-size:17px;display:block}
  .brand-text small{opacity:.85;font-size:12px}
  main{padding:16px 12px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  h2{font-size:15px;margin-bottom:10px}
  p{font-size:13px;line-height:1.7;color:#445}
  .btn{display:block;text-align:center;background:linear-gradient(90deg,#0a63c9,#2a86e8);color:#fff;text-decoration:none;border-radius:10px;padding:14px 0;font-size:15px;font-weight:600;margin-top:6px}
  .btn:active{opacity:.9}
  .badge{display:inline-block;background:#eef4fc;color:#0a63c9;border-radius:999px;font-size:12px;padding:4px 10px;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini{background:#f8fafd;border-radius:10px;padding:12px;text-align:center}
  .mini b{display:block;font-size:20px;color:#0a63c9}
  .mini span{font-size:12px;color:#778}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="brand-mark">翼</span>
    <div class="brand-text">
      <strong>中国电信资费专区</strong>
      <small>中国电信资费信息公示</small>
    </div>
  </div>
</div>
<main>
  <div class="card">
    <h2>当前状态说明</h2>
    <p>中国电信官网资费数据接口启用了风控校验（HTTP 412 拦截程序化抓取），暂时无法像移动、联通那样自动同步数据。
    本站以官方资费专区为权威来源，可点击下方按钮直达官方查看最新资费。</p>
    <a class="btn" href="https://www.189.cn/wapportalweb/rateZone/index.html" target="_blank" rel="noopener">前往中国电信官方资费专区</a>
  </div>
  <div class="card">
    <h2>接入路线图</h2>
    <div class="grid">
      <div class="mini"><b>31 省</b><span>资费专区覆盖</span></div>
      <div class="mini"><b>5 类</b><span>资费+增值业务</span></div>
    </div>
    <p style="margin-top:10px">待官方接口风控策略调整或提供合规数据源后，本站将补齐与移动、联通一致的总览与列表功能。</p>
  </div>
</main>
</body>
</html>
