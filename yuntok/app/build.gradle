plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nexio.yuntok'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexio.yuntok"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "1.6"
    }

    // 固定签名：CI 每次都是全新容器，默认的 debug keystore 会被重新生成，
    // 导致签名不一致 → 用户升级时必须先卸载。改用仓库 secret 里的固定 keystore。
    signingConfigs {
        yuntok {
            storeFile file(System.getenv("KS_FILE") ?: "yuntok.jks")
            storePassword System.getenv("KS_PASS") ?: ""
            keyAlias System.getenv("KS_ALIAS") ?: "yuntok"
            keyPassword System.getenv("KS_PASS") ?: ""
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.yuntok }
        debug   { signingConfig signingConfigs.yuntok }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
