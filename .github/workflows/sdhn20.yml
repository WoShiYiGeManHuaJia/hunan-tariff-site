name: TCSD2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - run: pip install pycryptodome -q
      - name: Test 609903/609904 tariff + Hunan announcement
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, base64, os, time, uuid
          from Crypto.Cipher import AES, PKCS1_v1_5
          from Crypto.PublicKey import RSA
          from Crypto.Util.Padding import pad
          from Crypto.Random import get_random_bytes
          UA="Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          out=[]

          # ---- 1. 资费 tariffSection.do (AES-ECB, key telecom_wap_2018) ----
          KEY=b"telecom_wap_2018"
          API="https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          def enc(m): return base64.b64encode(AES.new(KEY,AES.MODE_ECB).encrypt(pad(m.encode("utf-8"),16))).decode()
          def call(fn,rc,to=40):
              body=enc(json.dumps({"headerInfo":{"functionCode":fn},"requestContent":rc},ensure_ascii=False))
              req=urllib.request.Request(API,data=body.encode(),method="POST",headers={
                  "User-Agent":UA,"Referer":"https://www.189.cn/wapportalweb/rateZone/index.html",
                  "Accept":"application/json, text/plain, */*","Content-Type":"text/plain;charset=UTF-8",
                  "Origin":"https://www.189.cn","x-qd-reqtime":str(int(time.time()*1000))})
              for a in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=to) as r: return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e; time.sleep(2.5)
              return {"__err":str(last)}
          for p,nm in [("600203","湖南对照"),("609903","山东"),("609904","河南")]:
              d=call("tariffSectionHome",{"ticket":"","sessionid":"","provCode":p})
              rc=d.get("responseContent") or {}
              labs=rc.get("lableList") or rc.get("labelList") or []
              names=[]
              for L in labs[:6]:
                  names.append(str(L.get("lableName") or L.get("labelName") or L.get("name") or ""))
              out.append("TARIFF %s(%s) boards=%d :: %s"%(p,nm,len(labs)," | ".join([x for x in names if x])[:180]))
              out.append("   raw=%s"%json.dumps(d,ensure_ascii=False)[:300])
              time.sleep(2.5)

          # ---- 2. 公告 search/list.do (RSA+AES-CBC) ----
          PUB=""
          rsa=RSA.import_key(base64.b64decode(PUB))
          cipher_rsa=PKCS1_v1_5.new(rsa)
          BASE="https://www.189.cn"
          def spost(path,obj,timeout=40):
              aeskey=get_random_bytes(16); iv=get_random_bytes(16)
              ct=AES.new(aeskey,AES.MODE_CBC,iv).encrypt(pad(json.dumps(obj,ensure_ascii=False).encode(),16))
              k=base64.b64encode(cipher_rsa.encrypt(json.dumps({"key":base64.b64encode(aeskey).decode(),"iv":base64.b64encode(iv).decode()}).encode())).decode()
              body=json.dumps({"param":base64.b64encode(ct).decode(),"key":k}).encode()
              req=urllib.request.Request(BASE+path,data=body,method="POST",headers={
                  "User-Agent":UA,"Referer":"https://www.189.cn/web/notice",
                  "Accept":"application/json, text/plain, */*","Content-Type":"application/json;charset=UTF-8",
                  "Origin":"https://www.189.cn","Fcode":"Y121043001","TransactionId":str(uuid.uuid4()).replace("-","")})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r: return r.status, r.read().decode("utf-8","replace")
              except Exception as e: return 0, "ERR "+str(e)[:200]
          st,txt=spost("/wtBusiness/wtservice/nc/search/list.do",{"shopId":"20001","type":"wt_sy_bzzx","floorType":"1","provinceCode":"600203","cityCode":"hn"})
          out.append("LIST status=%d len=%d"%(st,len(txt)))
          out.append(txt[:2500])
          orders=[]
          try:
              j=json.loads(txt)
              for d0 in (j.get("data") or []):
                  orders.append((d0.get("order"),d0.get("title")))
          except Exception as e: out.append("parse err "+str(e)[:100])
          out.append("ORDERS=%s"%json.dumps(orders,ensure_ascii=False)[:600])
          if orders:
              st2,txt2=spost("/wtBusiness/wtservice/nc/search/list.do",{"shopId":"20001","type":"wt_sy_bzzx","order":orders[0][0],"provinceCode":"600203","cityCode":"hn"})
              out.append("ITEMS status=%d len=%d"%(st2,len(txt2)))
              out.append(txt2[:4000])
              try:
                  j2=json.loads(txt2); fis=(j2.get("data") or [{}])[0].get("floorItems") or []
                  out.append("ITEMCOUNT=%d"%len(fis))
                  for f in fis[:3]:
                      out.append(" ITEM %s | %s | %s"%(f.get("liveStartTime"),f.get("title"),f.get("externalOfferCode")))
                  if fis:
                      st3,txt3=spost("/wtBusiness/wtservice/nc/announcement/getAnnouncementDetail.do",{"type":fis[0].get("type") or "wt_sy_bzzx","offerCode":fis[0].get("externalOfferCode"),"provinceCode":"600203","cityCode":"hn"})
                      out.append("DETAIL status=%d len=%d"%(st3,len(txt3)))
                      out.append(txt3[:1500])
              except Exception as e: out.append("p2 err "+str(e)[:120])
          t="\n".join(out)
          print(t[:9000])
          tok=os.environ.get("GH_TOKEN"); repo="WoShiYiGeManHuaJia/hunan-tariff-site"; path="logs/sdhn20.txt"
          H={"Authorization":"token "+tok,"User-Agent":"x","Accept":"application/vnd.github+json"}
          sha=None
          try:
              d=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),headers=H),timeout=30).read()); sha=d.get("sha")
          except Exception: pass
          payload={"message":"sdhn20","content":base64.b64encode(t.encode()).decode()}
          if sha: payload["sha"]=sha
          try:
              urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),data=json.dumps(payload).encode(),headers=H,method="PUT"),timeout=60).read(); print("WROTE_OK")
          except Exception as e: print("WROTE_FAIL",e)
          PYEOF
