name: SDHN
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install pycryptodome -q
      - name: Scan for 山东/河南 provCode
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, time, base64, os
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad
          KEY = b"telecom_wap_2018"
          UA = "Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          API = "https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          def enc(m):
              return base64.b64encode(AES.new(KEY, AES.MODE_ECB).encrypt(pad(m.encode("utf-8"), 16))).decode("utf-8")
          def call(fn, rc):
              body = enc(json.dumps({"headerInfo": {"functionCode": fn}, "requestContent": rc}, ensure_ascii=False))
              req = urllib.request.Request(API, data=body.encode("utf-8"), method="POST", headers={
                  "User-Agent": UA,
                  "Referer": "https://www.189.cn/wapportalweb/rateZone/index.html",
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "text/plain;charset=UTF-8",
                  "Origin": "https://www.189.cn",
                  "x-qd-reqtime": str(int(time.time() * 1000)),
              })
              last=None
              for a in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e; time.sleep(1.5)
              raise last
          cands=[]
          for g in (6001,6002,6003,6004,6005,6006):
              for s in range(1,13):
                  cands.append("%d%02d" % (g, s))
          known={"600101":"广东","600102":"上海","600103":"江苏","600104":"浙江","600105":"福建",
                 "600201":"四川","600202":"湖北","600203":"湖南","600204":"陕西","600205":"云南",
                 "600301":"安徽","600302":"广西","600303":"新疆","600304":"重庆","600305":"江西",
                 "600402":"贵州","600403":"海南","1000000037":"全国"}
          hits=[]
          for prov in cands:
              if prov in known: continue
              try:
                  rc = call("tariffSectionHome", {"ticket":"","sessionid":"","provCode":prov})
                  rcc = rc.get("responseContent", {}) or {}
                  boards = rcc.get("lableOneList") or []
                  if not boards: continue
                  sess = rcc.get("sessionid")
                  names=set()
                  for b in boards[:3]:
                      try:
                          rq = call("tariffSectionQuery", {"sessionid":sess,"type":1,"provCode":prov,
                                                           "lable1Id":b["id"],"lable2Id":""})
                          lst = (rq.get("responseContent", {}) or {}).get("zoneTitleList") or []
                          for it in lst[:2]:
                              pn=str(it.get("provinceName",""))
                              if pn: names.add(pn)
                      except Exception: pass
                      time.sleep(0.25)
                      if names: break
                  hits.append("%s => %s" % (prov, ",".join(names) if names else "(boards=%d,name?)" % len(boards)))
                  print("HIT", prov, names, flush=True)
              except Exception as e:
                  pass
              time.sleep(0.2)
          txt = "SCAN 山东/河南:\n" + ("\n".join(hits) if hits else "(none)")
          print(txt)
          open("logs/prov_sdhn.txt","w").write(txt)
          PYEOF
      - name: Commit result
        run: |
          git config user.name "WoShiYiGeManHuaJia"
          git config user.email "Jiangzhongming2005@gmail.com"
          git add logs/prov_sdhn.txt 2>/dev/null || true
          git commit -m "prov scan sdhn" 2>/dev/null || echo "nochange"
          git push 2>/dev/null || echo "pushfail"
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe telecom notice sources
        run: |
          pip install pycryptodome -q
          python3 - << 'PYEOF'
          import urllib.request, json, os, re, gzip
          UA_M="Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          UA_C="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          def fetch(url, timeout=18, ua=UA_C, data=None, hdr=None):
              h={"User-Agent":ua,"Accept":"text/html,application/json,*/*","Accept-Language":"zh-CN,zh;q=0.9"}
              if hdr: h.update(hdr)
              try:
                  req=urllib.request.Request(url, headers=h, data=data)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw=r.read()
                      if r.headers.get("Content-Encoding")=="gzip": raw=gzip.decompress(raw)
                      return r.status, raw.decode("utf-8","replace")
              except Exception as e:
                  return 0, str(e)
          # 电信 wapportalweb 常见接口探测（公告类 functionCode）
          out=[]
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad
          import base64,time
          KEY=b"telecom_wap_2018"
          def enc(m): return base64.b64encode(AES.new(KEY,AES.MODE_ECB).encrypt(pad(m.encode("utf-8"),16))).decode("utf-8")
          API="https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          for fn in ["noticeList","queryNotice","notice","getNoticeList","queryNoticeList","announcementList"]:
              try:
                  body=enc(json.dumps({"headerInfo":{"functionCode":fn},"requestContent":{"provCode":"600203","pageNo":1,"pageSize":20}},ensure_ascii=False))
                  req=urllib.request.Request(API,data=body.encode("utf-8"),method="POST",headers={
                      "User-Agent":UA_M,"Referer":"https://www.189.cn/wapportalweb/rateZone/index.html",
                      "Accept":"application/json, text/plain, */*","Content-Type":"text/plain;charset=UTF-8",
                      "Origin":"https://www.189.cn","x-qd-reqtime":str(int(time.time()*1000))})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      t=r.read().decode("utf-8","replace")
                  out.append("FN %s -> 200 len=%d :: %s" % (fn,len(t),re.sub(r'\s+',' ',t[:300])))
              except Exception as e:
                  out.append("FN %s -> ERR %s" % (fn,e))
          urls=[
            "https://www.189.cn/web/notice/index.html",
            "https://www.189.cn/webportal/notice",
            "https://e.189.cn/",
            "https://www.189.cn/web/service/notice.html",
            "https://m.189.cn/web/notice/index.html",
            "https://www.189.cn/hn/web/notice/index.html",
            "https://189.cn/web/notice",
            "https://www.189.cn/web/notice/noticeList.jsp",
          ]
          for u in urls:
              s,t=fetch(u,ua=UA_M)
              waf=('$_ts' in t) or ('ICOn' in t) or s in (202,412,403)
              out.append("URL %s -> %s len=%d waf=%s" % (u,s,len(t),waf))
              if s==200 and len(t)>500 and not waf:
                  out.append("   HEAD "+re.sub(r'\s+',' ',t[:500]))
          txt="\n".join(out)
          print(txt)
          open("logs/notice_tel.txt","w").write(txt)
          PYEOF
        continue-on-error: true
      - name: Commit notice result
        run: |
          pip install pycryptodome -q 2>/dev/null || true
          git config user.name "WoShiYiGeManHuaJia"
          git config user.email "Jiangzhongming2005@gmail.com"
          git add logs/notice_tel.txt 2>/dev/null || true
          git commit -m "notice tel probe" 2>/dev/null || echo "nochange"
          git push 2>/dev/null || echo "pushfail"
        continue-on-error: true
