name: zz-git7
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 删除并重建为 GitHub 源
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          echo "=== 删除 hnvip ==="
          curl -sS -m 25 -X DELETE -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip" | head -c 200
          echo ""
          sleep 8
          echo "=== 重建 hnvip (GitHub 源) ==="
          curl -sS -m 30 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d '{
            "name":"hnvip",
            "production_branch":"main",
            "source":{"type":"github","config":{"owner":"WoShiYiGeManHuaJia","repo_name":"hunan-tariff-site","production_branch":"main","pr_comments_enabled":true,"deployments_enabled":true,"production_deployments_enabled":true,"preview_deployment_setting":"all","preview_branch_includes":["*"],"preview_branch_excludes":[],"path_includes":["*"],"path_excludes":[]}},
            "build_config":{"build_command":"","destination_dir":"","root_dir":""}
          }' "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | head -c 700
          echo ""
          sleep 5
          echo "=== 触发部署 ==="
          curl -sS -m 30 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
            -d '{"branch":"main"}' "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments" | head -c 400
          echo ""
      - name: 验证
        run: |
          sleep 70
          echo "hnvip -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 https://hnvip.pages.dev/ 2>&1)" >> /tmp/o/out.txt
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/git7.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"git7\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/git7.txt" || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"git7\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/git7.txt"
          echo done
