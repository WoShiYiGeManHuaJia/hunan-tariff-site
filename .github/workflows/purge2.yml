name: purge2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 多种 purge 路径
        run: |
          python3 - <<'PYEOF'
          import urllib.request,json
          paths=["https://purge.jsdelivr.net/gh/WoShiYiGeManHuaJia/hunan-tariff-site@main/yun.html",
                 "https://purge.jsdelivr.net/gh/WoShiYiGeManHuaJia/hunan-tariff-site/yun.html",
                 "https://purge.jsdelivr.net/gh/WoShiYiGeManHuaJia/hunan-tariff-site"]
          for p in paths:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(p,method='POST',headers={'User-Agent':'Mozilla/5.0'}),timeout=40)
                  print("purge %s -> %s %s"%(p[-40:], r.status, r.read().decode()[:120]))
              except Exception as e:
                  print("purge %s -> ERR %s"%(p[-40:], str(e)[:70]))
          PYEOF
      - name: 等 60 秒后复查
        run: |
          sleep 60
          python3 - <<'PYEOF'
          import urllib.request,re,ssl,json,base64,os
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          out=[]
          for u in ["https://cdn.jsdelivr.net/gh/WoShiYiGeManHuaJia/hunan-tariff-site@main/yun.html",
                    "https://gcore.jsdelivr.net/gh/WoShiYiGeManHuaJia/hunan-tariff-site@main/yun.html"]:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=40,context=ctx)
                  t=r.read().decode('utf-8','ignore')
                  out.append("%s\n  %d bytes realPhone=%d accMgr=%d"%(u.split('/')[2], len(t),
                     sum(t.count(x) for x in ['13787464642','17289519953','18289484895','13717306553']),
                     t.count('号码与 Cookie')))
              except Exception as e: out.append("%s ERR %s"%(u.split('/')[2],str(e)[:60]))
          open('chk4.txt','w').write("\n".join(out)); print("\n".join(out))
          PYEOF
      - name: 回写
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64,json,urllib.request,os
          tok=os.environ['GH_TOKEN']; repo="${{ github.repository }}"
          H={'Authorization':'token '+tok,'User-Agent':'x','Accept':'application/vnd.github+json'}
          b=base64.b64encode(open('chk4.txt','rb').read()).decode(); sha=None
          try:
              d=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/%s/contents/chk4.txt?ref=main'%repo,headers=H),timeout=60)); sha=d.get('sha')
          except Exception: pass
          pl={'message':'c','content':b,'branch':'main'}
          if sha: pl['sha']=sha
          urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/%s/contents/chk4.txt'%repo,data=json.dumps(pl).encode(),method='PUT',headers=H),timeout=120)
          PYEOF
