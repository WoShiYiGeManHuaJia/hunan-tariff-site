name: zz-chk4
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断并重建部署
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          exec > >(tee /tmp/o.txt) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip"
          echo "== TIME =="; date -u
          echo "== PROJECT PRODUCTION DEPLOYMENT =="
          curl -sS -m 25 -H "Authorization: Bearer $CF" "$API" -o /tmp/p.json
          python3 -c 'import json;d=json.load(open("/tmp/p.json"));r=d.get("result",{});print("success",d.get("success"));print("prod",json.dumps(r.get("active_deployment",{}),ensure_ascii=False)[:500]);print("latest",json.dumps(r.get("latest_deployment",{}),ensure_ascii=False)[:500]);print("source",json.dumps(r.get("source",{}),ensure_ascii=False)[:300])'
          echo "== DEPLOYMENTS 25 =="
          curl -sS -m 25 -H "Authorization: Bearer $CF" "$API/deployments?per_page=25" -o /tmp/d.json
          python3 -c 'import json;d=json.load(open("/tmp/d.json"));print("success",d.get("success"));[print(x.get("created_on"),x.get("short_id"),x.get("environment"),json.dumps(x.get("latest_stage",{}),ensure_ascii=False)[:170],[s.get("name")+":"+str(s.get("status")) for s in x.get("stages",[])][-4:]) for x in d.get("result",[])[:25]]'
          echo "== FORCE NEW DEPLOY =="
          curl -sS -m 25 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d '{"branch":"main"}' "$API/deployments" -o /tmp/n.json
          python3 -c 'import json;d=json.load(open("/tmp/n.json"));r=d.get("result",{});print("success",d.get("success"),"id",r.get("short_id"),"stage",json.dumps(r.get("latest_stage",{}),ensure_ascii=False)[:200],"errors",json.dumps(d.get("errors"),ensure_ascii=False)[:300])'
          echo "== WAIT 100s =="; sleep 100
          T=$(date +%s)
          echo "== ONLINE version =="
          curl -sS -m 30 "https://hnvip.pages.dev/version.json?_t=$T"; echo
          echo "== ONLINE index =="
          curl -sS -m 45 "https://hnvip.pages.dev/?_t=$T" -o /tmp/i.html
          python3 -c 't=open("/tmp/i.html",encoding="utf8",errors="replace").read();print("bytes",len(t),"newver",("20261107f" in t),"old_daily",("getMonth() + 1" in t),"has_seccache",("__secCache" in t))'
          echo "== WRITE =="
          B64=$(base64 -w0 /tmp/o.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/zz-chk4.txt" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha",""))')
          if [ -n "$SHA" ]; then
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"chk4\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-chk4.txt" -o /dev/null -w "write=%{http_code}\n"
          else
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"chk4\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-chk4.txt" -o /dev/null -w "write=%{http_code}\n"
          fi
