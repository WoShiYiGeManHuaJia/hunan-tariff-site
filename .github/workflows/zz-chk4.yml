name: zz-chk4
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断 500
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          echo "=== 部署详情 ==="
          curl -sS -m 25 -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for x in d.get('result',[])[:2]:
              print(' id:',x.get('short_id'),'| url:',x.get('url'))
              print('  stage:',json.dumps(x.get('latest_stage'),ensure_ascii=False))
              print('  stages:',[s.get('name')+':'+str(s.get('status')) for s in x.get('stages',[])])
          "
          echo "=== 访问 deployment url ==="
          echo "eadcc3bd -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 https://eadcc3bd.hnvip.pages.dev/ 2>&1)"
          echo "=== 完整响应头 ==="
          curl -sS -I -L --max-time 30 https://hnvip.pages.dev/ 2>&1 | head -20
          echo "=== 对比 hunan-tariff-site ==="
          echo "old -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 https://hunan-tariff-site.pages.dev/ 2>&1)"
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/chk4.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"chk4\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/chk4.txt" || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"chk4\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/chk4.txt"
          echo done
