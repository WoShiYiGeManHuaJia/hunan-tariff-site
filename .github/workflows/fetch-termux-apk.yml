name: fetch termux apk to site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-termux-apk.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download termux arm64 apk
        run: |
          mkdir -p apk
          curl -sSL --retry 3 --retry-delay 5 \
            -o apk/termux-arm64.apk \
            "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3%2Bgithub-debug_arm64-v8a.apk"
          SIZE=$(stat -c%s apk/termux-arm64.apk)
          echo "size=$SIZE"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "download looks broken, abort"
            exit 1
          fi
          ls -la apk/

      - name: commit with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch origin main || true
            git reset --soft origin/main || true
            git add -f apk/termux-arm64.apk
            if git diff --cached --quiet; then
              echo "no change to commit"
              break
            fi
            git commit -m "add termux apk for in-app download" || continue
            if git push origin HEAD:main; then
              echo "pushed ok"
              break
            fi
            echo "push attempt $i failed, retry"
            sleep 8
          done
          git show --stat HEAD | head -5 || true
