name: hnvip-rebuild
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: 重建为纯直传项目
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/hnvip_rebuild_only.py
