name: cert-watch
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: write
  pages: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: try enable https
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
          echo "UTC: $(date -u)"
          gh api repos/WoShiYiGeManHuaJia/hunan-tariff-site/pages > p.json 2>&1
          state=$(jq -r '.https_certificate.state // "none"' p.json 2>/dev/null)
          enforced=$(jq -r '.https_enforced' p.json 2>/dev/null)
          echo "state=$state enforced=$enforced"
          if [ "$state" = "issued" ] && [ "$enforced" = "false" ]; then
            echo "-- enabling --"
            gh api -X PUT repos/WoShiYiGeManHuaJia/hunan-tariff-site/pages \
              -f cname=hnvip.qd.je -F https_enforced=true 2>&1 | head -c 400
            echo
            echo "DONE"
          else
            echo "skip"
          fi
          } > cert_status.txt 2>&1
          cat cert_status.txt
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add cert_status.txt
          git diff --cached --quiet || git commit -m "cert status"
          git push
