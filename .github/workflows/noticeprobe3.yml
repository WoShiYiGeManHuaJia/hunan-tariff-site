name: NoticeProbe3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Probe alternate telecom notice endpoints
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, base64, os, re, gzip
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          def fetch(url, timeout=20):
              h = {"User-Agent": UA, "Accept": "text/html,application/json,*/*", "Accept-Language": "zh-CN,zh;q=0.9"}
              try:
                  req = urllib.request.Request(url, headers=h)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read()
                      if r.headers.get("Content-Encoding") == "gzip": raw = gzip.decompress(raw)
                      return r.status, raw.decode("utf-8", errors="replace")
              except Exception as e:
                  return 0, "%s" % e
          urls = [
            "https://m.189.cn/",
            "https://wap.189.cn/",
            "https://www.189.cn/",
            "https://www.189.cn/web/notice/index.html",
            "https://service.189.cn/",
            "https://www.189.cn/hn/",
            "https://www.189.cn/web/hn/notice",
            "https://m.189.cn/web/notice",
            "https://www.189.cn/web/notice/list",
            "https://www.189.cn/portal/web/notice",
          ]
          out=[]
          for u in urls:
              s,t = fetch(u)
              iswaf = ('$_ts' in t) or ('ICOn' in t) or s in (202,412,403)
              out.append("URL %s -> %s len=%d waf=%s" % (u, s, len(t), iswaf))
              if s==200 and len(t)>300 and not iswaf:
                  out.append("   HEAD "+re.sub(r'\s+',' ',t[:400]))
          txt="\n".join(out)
          print(txt)
          tok=os.environ.get("GH_TOKEN"); repo="WoShiYiGeManHuaJia/hunan-tariff-site"; path="logs/notice_probe3.txt"
          H={"Authorization":"token "+tok,"User-Agent":"x","Accept":"application/vnd.github+json"}
          sha=None
          try:
              d=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),headers=H),timeout=30).read())); sha=d.get("sha")
          except Exception: pass
          payload={"message":"notice probe3","content":base64.b64encode(txt.encode()).decode()}
          if sha: payload["sha"]=sha
          try:
              urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),data=json.dumps(payload).encode(),headers=H,method="PUT"),timeout=60).read(); print("WROTE_OK")
          except Exception as e: print("WROTE_FAIL",e)
          PYEOF
