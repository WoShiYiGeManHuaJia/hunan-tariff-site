name: Unicom Fetch
# 公开仓 Actions 免费不限量（私有仓额度已耗尽）

on:
  schedule:
    - cron: "37 1,13 * * *"    # 北京 09:37 / 21:37
  workflow_dispatch:
    inputs:
      rebuild:
        description: "重建基线（跳过对比，不写历史）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unicom-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行联通管线
        run: |
          set -e
          mkdir -p unicom/data
          FLAG=""
          if [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            FLAG="--rebuild"
            echo "[]" > unicom/data/history.json
          fi
          echo "=== 开始 $(date -u +%FT%TZ) ===" > fetch_run.log
          free -m >> fetch_run.log 2>&1 || true
          set +e
          python3 -u pipelines/unicom_pipeline.py \
            --prev-dir unicom/data \
            --out-dir unicom/data \
            $FLAG >> fetch_run.log 2>&1
          EC=$?
          set -e
          echo "--- 管线结束 exit=$EC $(date -u +%FT%TZ) ---" >> fetch_run.log
          free -m >> fetch_run.log 2>&1 || true
          tail -80 fetch_run.log

      - name: 抓取公告
        continue-on-error: true
        run: python3 pipelines/scripts/announce_fetch.py --uni-dir unicom/data

      - name: 提交
        if: always()
        run: |
          set -e
          # 备份本次产物（防止被远程新提交冲掉）
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a unicom /tmp/art/ 2>/dev/null || true
          cp -f fetch_run.log /tmp/art/ 2>/dev/null || true
          # 硬对齐远端，彻底消除 push 冲突
          git fetch origin main || true
          git reset --hard FETCH_HEAD || true
          # ── 原子恢复产物 ──
          # 此前是 rm -rf unicom 后再 cp，且 cp 带 || true：
          # 一旦 cp 失败（磁盘满 / /tmp 被清理 / 权限），目录已被删除，
          # git add -A 会把「整个数据目录消失」当成正常变更提交上去。
          # 改为先复制到 .new、校验存在、再 mv 原子替换；缺失即中止。
          if [ ! -d /tmp/art/unicom ]; then
            echo "::error::产物目录缺失（/tmp/art/unicom），中止提交以避免误删线上数据"
            exit 1
          fi
          rm -rf unicom.new
          cp -a /tmp/art/unicom ./unicom.new || { echo "::error::产物复制失败，中止"; exit 1; }
          rm -rf unicom
          mv unicom.new unicom || { echo "::error::产物替换失败，中止"; exit 1; }
          cp -f /tmp/art/fetch_run.log ./fetch_run.log 2>/dev/null || true
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f fetch_run.log
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -q -m "unicom fetch $(date -u +%FT%TZ)"
            for i in 1 2 3 4 5; do
              if git push origin main; then echo "已推送"; break; fi
              echo "[warn] push 失败，重新对齐后重试 ($i/5)"
              git fetch origin main
              git reset --hard FETCH_HEAD
              cp -a /tmp/art/unicom/. ./unicom/ 2>/dev/null || echo "[warn] 产物恢复失败（保留远端版本）"
              cp -f /tmp/art/fetch_run.log ./fetch_run.log 2>/dev/null || true
              git add -A; git add -f fetch_run.log
              git commit -q -m "unicom fetch $(date -u +%FT%TZ) retry$i" || true
              sleep 8
            done
          fi
          ls -la fetch_run.log 2>/dev/null | head -2
