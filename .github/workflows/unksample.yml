name: UnkProvSample
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install pycryptodome -q
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, time, base64, os, re
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad
          KEY = b"telecom_wap_2018"
          UA = "Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          API = "https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          def encrypt(m):
              return base64.b64encode(AES.new(KEY, AES.MODE_ECB).encrypt(pad(m.encode("utf-8"), 16))).decode("utf-8")
          def call(fn, rc):
              body = encrypt(json.dumps({"headerInfo": {"functionCode": fn}, "requestContent": rc}, ensure_ascii=False))
              req = urllib.request.Request(API, data=body.encode("utf-8"), method="POST", headers={
                  "User-Agent": UA,
                  "Referer": "https://www.189.cn/wapportalweb/rateZone/index.html",
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "text/plain;charset=UTF-8",
                  "Origin": "https://www.189.cn",
                  "x-qd-reqtime": str(int(time.time() * 1000)),
              })
              last=None
              for a in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e; time.sleep(1.2*(a+1))
              return None
          # 候选：全部 21 个有效码，重点挖未识别的 600401/600404/600405
          ALL = ["600101","600102","600103","600104","600105",
                 "600201","600202","600203","600204","600205",
                 "600301","600302","600303","600304","600305",
                 "600401","600402","600403","600404","600405","600406"]
          CITY = {
            "山东":["山东","济南","青岛","烟台","潍坊","淄博","临沂","济宁","泰安","威海","东营","日照","枣庄","聊城","德州","滨州","菏泽"],
            "河南":["河南","郑州","洛阳","开封","南阳","新乡","许昌","周口","商丘","信阳","驻马店","安阳","焦作","平顶山","濮阳","漯河","三门峡","鹤壁"],
            "河北":["河北","石家庄","唐山","保定","邯郸","秦皇岛","廊坊","沧州","邢台","张家口","承德","衡水"],
            "山西":["山西","太原","大同","临汾","运城","长治","晋中"],
            "辽宁":["辽宁","沈阳","大连","鞍山","抚顺","锦州"],
            "吉林":["吉林","长春","延边"],
            "黑龙江":["黑龙江","哈尔滨","大庆","齐齐哈尔"],
            "内蒙古":["内蒙古","呼和浩特","包头","赤峰"],
            "甘肃":["甘肃","兰州","天水"],
            "青海":["青海","西宁"],
            "宁夏":["宁夏","银川"],
            "天津":["天津"],
            "北京":["北京"],
          }
          out = {}
          for prov in ALL:
              d = call("tariffSectionHome", {"ticket":"","sessionid":"","provCode":prov})
              rc = (d or {}).get("responseContent", {}) or {}
              boards = rc.get("lableOneList") or []
              if not boards:
                  continue
              sess = rc.get("sessionid")
              names = []
              for b in boards:
                  q = call("tariffSectionQuery", {"sessionid":sess,"type":1,"provCode":prov,"lable1Id":b["id"],"lable2Id":""})
                  qr = (q or {}).get("responseContent", {}) or {}
                  for x in (qr.get("zoneTitleList") or []):
                      n = x.get("name","")
                      if n: names.append(n)
                  time.sleep(0.25)
              blob = " | ".join(names)
              hit = {}
              for p,ws in CITY.items():
                  c = sum(blob.count(w) for w in ws)
                  if c: hit[p]=c
              out[prov] = {"n": len(names), "hit": hit, "sample": names[:60]}
              print("PROV %s n=%d hit=%s" % (prov, len(names), hit))
              print("   sample: %s" % blob[:260])
              time.sleep(0.3)
          os.makedirs("_probe", exist_ok=True)
          open("_probe/sample.json","w").write(json.dumps(out, ensure_ascii=False, indent=1))
          print("DONE", len(out))
          PYEOF
      - name: Commit
        run: |
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _probe
          git commit -q -m "probe: prov samples $(date -u +%FT%TZ)" || echo "no change"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo pushed; break; }
            sleep 5
          done
