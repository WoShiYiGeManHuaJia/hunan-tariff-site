name: zz-short2
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 试短名
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o
          O=/tmp/o/out.txt
          exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          echo "=== try pages short names ==="
          for N in hn66 hn99 hnnb hnvip2 hn-tariff hnvip0; do
            echo "--- $N"
            curl -sS -m 25 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d "{\"name\":\"$N\",\"production_branch\":\"main\"}" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | head -c 300
            echo ""
          done
          echo "=== workers subdomain ==="
          curl -sS -m 25 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | head -c 300
          echo ""
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/short2.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"short2\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/short2.txt" || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"short2\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/short2.txt"
          echo done
