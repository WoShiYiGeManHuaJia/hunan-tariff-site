name: ann-probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 复现公告抓取(联通)
        continue-on-error: true
        run: |
          mkdir -p /tmp/up
          python3 -u pipelines/scripts/announce_fetch.py --uni-dir /tmp/up > /tmp/uni_step.log 2>&1
          echo "EXIT=$?" >> /tmp/uni_step.log
      - name: 探测省份归属
        continue-on-error: true
        run: |
          python3 - <<'PY' >> /tmp/uni_step.log 2>&1
          import urllib.request,urllib.parse,json
          url='https://www.10010.com/mall/service/query/announcementquery'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36',
             'X-Requested-With':'XMLHttpRequest','Accept':'application/json, text/javascript, */*; q=0.01',
             'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
             'Referer':'https://www.10010.com/wt_links/index.html','Origin':'https://www.10010.com'}
          def q(p):
              d=urllib.parse.urlencode({'pageNo':'1','pageSize':'3','province':p,'condition':'0','title':''}).encode()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,data=d,headers=H),timeout=25).read().decode('utf-8','ignore')
                  rows=json.loads(r).get('result') or []
                  return [(x.get('creatorProvinceName'),str(x.get('title'))[:26],x.get('publishTime')) for x in rows[:3]]
              except Exception as e: return 'ERR:'+type(e).__name__
          print("=== XHR头探测 province -> (省名,标题,日期) ===")
          for p in ['031','011','013','017','018','019','030','034','036','038']:
              print(p,'=>',q(p))
          PY
      - name: 上传结果
        run: |
          B64=$(base64 -w0 /tmp/uni_step.log)
          printf '{"message":"probe log","content":"%s"}' "$B64" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json \
            "https://api.github.com/repos/${{ github.repository }}/contents/uni_step.log" | head -c 300
