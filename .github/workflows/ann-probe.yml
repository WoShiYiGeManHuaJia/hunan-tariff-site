name: fix-uni-announce
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓湖南联通公告并写回仓库根
        run: |
          python3 -u pipelines/scripts/announce_fetch.py --uni-dir "$GITHUB_WORKSPACE/unicom/data" 2>&1 | tail -5
          echo "=== 结果 ==="
          python3 -c "
          import json
          d=json.load(open('unicom/data/announce.json',encoding='utf-8'))
          print('updated',d['updated'],'count',d['count'])
          for i in d['items'][:12]: print(' ',i['date'],'|',i['title'][:44])
          "
      - name: 提交
        run: |
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unicom/data/announce.json
          if git diff --cached --quiet; then echo "无变化"; else git commit -q -m "fix: 联通公告改抓湖南(province 074)写入仓库根" && git push; fi
