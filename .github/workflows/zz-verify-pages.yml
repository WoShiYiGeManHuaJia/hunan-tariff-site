name: zz-verify-pages
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 验证站点内容
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          echo "===== 首页 ====="
          curl -sS -L --max-time 30 https://hunan-tariff-site.pages.dev | head -c 1200
          echo ""
          echo "===== 关键资源 ====="
          for p in index.html data/summary.json data/latest.json manage.html cmcc.html t.html termux.html; do
            echo "$p -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 https://hunan-tariff-site.pages.dev/$p)"
          done
          echo "===== 数据新鲜度 ====="
          curl -sS -L --max-time 25 https://hunan-tariff-site.pages.dev/data/summary.json 2>/dev/null | head -c 300
          echo ""
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/ver.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"verify\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/ver.txt" \
          || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"verify\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/ver.txt"
          echo done
