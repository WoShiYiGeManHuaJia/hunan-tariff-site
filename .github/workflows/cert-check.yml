name: cert-check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          D=hnvip.qd.je
          O=cert-out.txt
          : > $O
          {
          echo "== A (google)"; dig +short A $D @8.8.8.8
          echo "== A (cf)"; dig +short A $D @1.1.1.1
          echo "== AAAA"; dig +short AAAA $D @8.8.8.8
          echo "== NS"; dig +short NS $D @8.8.8.8
          echo "== CAA"; dig +short CAA $D @8.8.8.8
          echo "== CAA-qdje"; dig +short CAA qd.je @8.8.8.8
          echo "== HTTP"; curl -sS -m 15 -o /dev/null -w "code=%{http_code} ip=%{remote_ip}\n" http://$D/
          echo "== ACME"; curl -sS -m 15 -o /dev/null -w "code=%{http_code}\n" http://$D/.well-known/acme-challenge/probe
          echo "== TLS"; echo | timeout 20 openssl s_client -connect $D:443 -servername $D 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          } >> $O 2>&1
          cat $O
      - name: Push
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add cert-out.txt
          git commit -m "cert probe $(date -u +%s)" || echo "no change"
          git push
