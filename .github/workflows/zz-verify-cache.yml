name: zz-verify-cache
on:
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: verify
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          exec > >(tee /tmp/v.txt) 2>&1
          echo "== TIME =="; date -u
          sleep 60
          T=$(date +%s)
          echo "== version.json =="
          curl -sS -m 30 "https://hnvip.pages.dev/version.json?_t=$T"; echo
          echo "== index.html =="
          curl -sS -m 45 "https://hnvip.pages.dev/?_t=$T" -o /tmp/idx.html
          python3 -c 't=open("/tmp/idx.html",encoding="utf8",errors="replace").read();print("bytes",len(t));print("BUILD_VER_f","BUILD_VER = \"20261107f\"" in t);print("has___secCache","__secCache" in t);print("old_daily_key_active","q = \"_d=\"" in t);print("no_store_all","{cache:\"no-store\"}" in t)'
          echo "== fresh.html =="
          curl -sS -m 30 -o /dev/null -w "HTTP=%{http_code}\n" "https://hnvip.pages.dev/fresh.html?_t=$T"
          echo "== history =="
          curl -sS -m 60 "https://hnvip.pages.dev/data/history.json?_t=$T" -o /tmp/h.json
          python3 -c 'import json;h=json.load(open("/tmp/h.json"));print("count",len(h),"last",h[-1].get("ts"))'
          echo "== latest =="
          curl -sS -m 30 "https://hnvip.pages.dev/data/latest.json?_t=$T" -o /tmp/l.json
          python3 -c 'import json;d=json.load(open("/tmp/l.json"));print("updated",d.get("updated"),"hunan",d.get("hunan_total"))'
          echo "== WRITE =="
          B64=$(base64 -w0 /tmp/v.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/zz-verify.txt" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha",""))')
          if [ -n "$SHA" ]; then
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"v\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-verify.txt" -o /dev/null -w "write=%{http_code}\n"
          else
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"v\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-verify.txt" -o /dev/null -w "write=%{http_code}\n"
          fi
