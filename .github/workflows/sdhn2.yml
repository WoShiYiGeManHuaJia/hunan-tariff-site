name: SDHN2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  id:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - run: pip install pycryptodome -q
      - name: Identify provinces by applicablePeople
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, time, base64, os
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad
          KEY=b"telecom_wap_2018"
          UA="Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          API="https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          def enc(m): return base64.b64encode(AES.new(KEY,AES.MODE_ECB).encrypt(pad(m.encode("utf-8"),16))).decode()
          def call(fn,rc,to=30):
              body=enc(json.dumps({"headerInfo":{"functionCode":fn},"requestContent":rc},ensure_ascii=False))
              req=urllib.request.Request(API,data=body.encode(),method="POST",headers={
                  "User-Agent":UA,"Referer":"https://www.189.cn/wapportalweb/rateZone/index.html",
                  "Accept":"application/json, text/plain, */*","Content-Type":"text/plain;charset=UTF-8",
                  "Origin":"https://www.189.cn","x-qd-reqtime":str(int(time.time()*1000))})
              last=None
              for a in range(2):
                  try:
                      with urllib.request.urlopen(req,timeout=to) as r: return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e; time.sleep(1.5)
              return {"__err":str(last)}
          cands=[str(x) for x in range(600401,600421)]+[str(x) for x in range(609901,609921)]
          out=[]
          for p in cands:
              d=call("tariffSectionHome",{"ticket":"","sessionid":"","provCode":p})
              rc=d.get("responseContent") or {}
              b=rc.get("lableOneList") or []
              if not b: continue
              sess=rc.get("sessionid")
              scopes=set(); names=[]
              for bo in b:
                  rq=call("tariffSectionQuery",{"sessionid":sess,"type":1,"provCode":p,"lable1Id":bo["id"],"lable2Id":""})
                  lst=(rq.get("responseContent") or {}).get("zoneTitleList") or []
                  for x in lst[:40]:
                      ap=str(x.get("applicablePeople") or "").strip()
                      if ap: scopes.add(ap[:40])
                      if len(names)<3: names.append(str(x.get("name","")))
                  time.sleep(0.25)
              out.append("%s :: boards=%d :: SCOPE=%s :: %s"%(p,len(b)," / ".join(sorted(scopes))[:300]," | ".join(names)[:120]))
              time.sleep(0.2)
          txt="\n".join(out)
          print(txt[:20000])
          tok=os.environ.get("GH_TOKEN"); repo="WoShiYiGeManHuaJia/hunan-tariff-site"; path="logs/sdhn2.txt"
          H={"Authorization":"token "+tok,"User-Agent":"x","Accept":"application/vnd.github+json"}
          sha=None
          try:
              dd=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),headers=H),timeout=30).read()); sha=dd.get("sha")
          except Exception: pass
          payload={"message":"sdhn2","content":base64.b64encode(txt.encode()).decode()}
          if sha: payload["sha"]=sha
          try:
              urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),data=json.dumps(payload).encode(),headers=H,method="PUT"),timeout=60).read(); print("WROTE_OK")
          except Exception as e: print("WROTE_FAIL",e)
          PYEOF
