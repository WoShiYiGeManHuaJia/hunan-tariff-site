name: hnvip-emergency
on:
  workflow_dispatch:
concurrency:
  group: hnvip-emergency
  cancel-in-progress: false
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: 立刻恢复访问
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/hnvip_emergency.py
