name: Unicom Removed Verify (one-off)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run verification
        run: |
          mkdir -p tools
          python3 tools/verify_removed.py 2>&1 | tail -80
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f tools/verify_result.json || true
          git diff --cached --quiet || git commit -m "联通下架核验结果 $(date -u +%F_%H%M)"
          git push || true
