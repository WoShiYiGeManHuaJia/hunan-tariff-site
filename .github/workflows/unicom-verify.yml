name: Unicom Removed Verify (one-off)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run verification
        run: |
          ls -la tools/
          python3 tools/verify_removed.py
          echo "exit=$?"
          cat tools/verify_out.txt
      - name: Commit result
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -f tools/verify_result.json tools/verify_out.txt
          git diff --cached --quiet || git commit -m "联通下架核验结果 $(date -u +%F_%H%M)"
          for i in 1 2 3 4 5; do git push && break || (git pull --rebase origin main; sleep 3); done
