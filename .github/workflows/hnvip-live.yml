name: hnvip-live
# hnvip.pages.dev 是 Cloudflare Pages 直传(ad_hoc)项目，不跟 GitHub 自动构建。
# 历史故障逐条封死：
#  1) 密集 push 全量直传 + cancel-in-progress 打断构建 → 生产指向半成品 → 全站 500
#  2) paths 含本工作流自身 → 改一次触发一次，自激连锁
#  3) manifest 用对象格式 → stage=success 但产物为空 → 全站 500
#  4) 部署 success ≠ 线上更新，必须回读线上 updated 与仓库比对
# 逻辑本体在 scripts/hnvip_sync.py；本文件只负责触发与环境。
# 定时兜底由 hnvip-guard 负责（先比后传），这里不设 schedule。
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'unicom/data/**'
      - 'telecom/data/**'
      - 'gb/data/**'
      - 'site/data/**'
      - 'pipelines/site/data/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'common-extras.js'
      - '_headers'
      - 'version.json'
      # 故意不含 .github/workflows/**、scripts/**、hnvip_*_state.txt，避免自激
  workflow_dispatch:
    inputs:
      force:
        description: '忽略一致性检查，强制直传一次'
        required: false
        default: 'false'
      repair:
        description: '同时把项目改回纯直传并切生产（站点 500 时用）'
        required: false
        default: 'false'
      rebuild:
        description: '删除并重建为纯直传项目（项目被绑错仓库时用）'
        required: false
        default: 'false'

concurrency:
  group: hnvip-sync          # 与 hnvip-guard 共用，同一时刻只允许一个部署
  cancel-in-progress: false  # 绝不打断正在构建的部署

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 直传并自愈
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
          FORCE: ${{ inputs.force }}
          REPAIR: ${{ inputs.repair }}
          REBUILD: ${{ inputs.rebuild }}
          EVENT: ${{ github.event_name }}
          ALERT: ${{ vars.HNVIP_ALERT }}
          DING_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DING_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 scripts/hnvip_sync.py
