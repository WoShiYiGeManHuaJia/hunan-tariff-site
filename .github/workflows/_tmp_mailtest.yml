name: _tmp_mailtest
on:
  workflow_dispatch:
    inputs:
      smtp_user: { description: "u", required: false }
      smtp_pass: { description: "p", required: false }
permissions:
  contents: none
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 测试 SMTP
        env:
          U: ${{ github.event.inputs.smtp_user }}
          P: ${{ github.event.inputs.smtp_pass }}
        run: |
          echo "::add-mask::$U"
          echo "::add-mask::$P"
          python3 - << 'PY' > /tmp/err.txt 2>&1 || { echo "::error::$(cat /tmp/err.txt | tr '\n' ' ' | cut -c1-300)"; exit 1; }
          import smtplib, os, sys, socket
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.header import Header
          HOST, PORT = "smtp.qq.com", 465
          U, P = os.environ["U"], os.environ["P"]
          print("DNS:", socket.gethostbyname(HOST))
          msg = MIMEMultipart("alternative")
          msg["Subject"] = Header("mail test", "utf-8")
          msg["From"] = U; msg["To"] = U
          msg.attach(MIMEText("test", "plain", "utf-8"))
          try:
              s = smtplib.SMTP_SSL(HOST, PORT, timeout=30)
              print("CONNECTED")
              s.login(U, P)
              print("LOGIN_OK")
              s.sendmail(U, [U], msg.as_string())
              s.quit()
              print("RESULT=SEND_OK")
          except Exception as e:
              print("RESULT=FAIL", type(e).__name__, str(e)[:250])
              sys.exit(1)
          PY
