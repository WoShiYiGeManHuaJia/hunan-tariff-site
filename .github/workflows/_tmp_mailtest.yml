name: _tmp_mailtest
on:
  workflow_dispatch:
    inputs:
      smtp_user:
        description: u
        required: false
      smtp_pass:
        description: p
        required: false
permissions:
  contents: none
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: step-LOGIN-DIAG
        env:
          U: ${{ github.event.inputs.smtp_user }}
          P: ${{ github.event.inputs.smtp_pass }}
        run: |
          echo "::add-mask::$P"
          set +e
          timeout 30 python3 -c "
import smtplib,os,sys
U,P=os.environ['U'],os.environ['P']
try:
    s=smtplib.SMTP_SSL('smtp.qq.com',465,timeout=25)
    s.login(U,P); s.quit(); print('LOGIN OK'); sys.exit(0)
except smtplib.SMTPAuthenticationError as e:
    print('AUTH_FAIL code=', e.smtp_code); sys.exit(10)
except smtplib.SMTPSenderRefused as e:
    print('SENDER_REFUSED'); sys.exit(11)
except Exception as e:
    print('OTHER', type(e).__name__); sys.exit(12)
"
          EC=$?
          echo "EXITCODE=$EC"
          if [ "$EC" = "10" ]; then echo "结论=授权码错误或SMTP未开启(535)"; fi
          if [ "$EC" = "11" ]; then echo "结论=发件人被拒"; fi
          if [ "$EC" = "12" ]; then echo "结论=其他异常"; fi
          exit $EC
