name: AnnProbe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome -q
      - run: python3 -u pipelines/scripts/_ann_probe.py 2>&1 | tee _annprobe4_out.txt
      - name: 提交日志
        run: |
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _annprobe4_out.txt
          git commit -q -m "ann probe $(date -u +%F' '%T) UTC" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep 6; done
