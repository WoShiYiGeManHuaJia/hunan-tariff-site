name: AnnProbe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome -q
      - run: python3 -u pipelines/scripts/_ann_probe.py 2>&1 | tee _annprobe4_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ann-probe-out
          path: _annprobe4_out.txt
