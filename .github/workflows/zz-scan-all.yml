name: zz-scan-all
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 扫 Cloudflare Pages 全部项目
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          echo "=== CF Pages 项目 ==="
          curl -sS -m 25 -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('result',[]):
              print('  %-30s %s' % (p['name'], p.get('subdomain')))
          "
          echo "=== 老账号 github.io 页面 ==="
          echo "WoShiYiGeManHuaJia.github.io -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 https://woshiyigemanhuajia.github.io/ 2>&1)"
          echo "=== kebiao pages ==="
          echo "kebiao-50p -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 https://kebiao-50p.pages.dev/ 2>&1)"
          echo "=== 面板相关探测 ==="
          for h in yun139.pages.dev yun139-panel.pages.dev panel.pages.dev; do
            echo "$h -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 https://$h/ 2>&1)"
          done
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/scan.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"scan\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/scan.txt" || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"scan\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/scan.txt"
          echo done
