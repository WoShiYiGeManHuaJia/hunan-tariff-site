name: probe4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 装 Playwright
        run: |
          npm i --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium
      - name: 探测登录态
        env:
          CK10086: ${{ secrets.CK10086 }}
        run: node probe4.js 2>&1 | tee probe4.log
      - name: 回写
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B64=$(base64 -w0 probe4.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/probe4.txt?ref=main" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -d "{\"message\":\"probe4\",\"content\":\"$B64\",\"branch\":\"main\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/probe4.txt" > /dev/null
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -d "{\"message\":\"probe4\",\"content\":\"$B64\",\"branch\":\"main\"}" "https://api.github.com/repos/${{ github.repository }}/contents/probe4.txt" > /dev/null
          fi
