name: hnvip-fix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 关闭 GitHub 自动部署并回滚生产
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, subprocess, base64, time
          CF=os.environ['CF']; PAT=os.environ['PAT']; REPO=os.environ['GITHUB_REPOSITORY']
          ACC='9156c2cae565fdf42d208827b523e47e'
          B='https://api.cloudflare.com/client/v4/accounts/'+ACC+'/pages/projects/hnvip'
          out=[]
          def req(url, method='GET', body=None):
              data=json.dumps(body).encode() if body is not None else None
              r=urllib.request.Request(url,data=data,method=method,
                  headers={'Authorization':'Bearer '+CF,'Content-Type':'application/json','User-Agent':'hnvip-fix'})
              return json.loads(urllib.request.urlopen(r,timeout=60).read())
          # 1. 读项目完整配置
          p=req(B)['result']; src=p.get('source') or {}
          cfg=dict(src.get('config') or {})
          out.append('BEFORE production_deployments_enabled=%s deployments_enabled=%s preview=%s'
                     % (cfg.get('production_deployments_enabled'), cfg.get('deployments_enabled'),
                        cfg.get('preview_deployment_setting')))
          # 2. 关闭 GitHub 自动部署：push 不再产生 idle 部署覆盖生产
          cfg['production_deployments_enabled']=False
          cfg['deployments_enabled']=False
          cfg['preview_deployment_setting']='none'
          new_src={'type':src.get('type','github'),'config':cfg}
          try:
              r=req(B,'PATCH',{'name':p.get('name','hnvip'),'source':new_src})
              out.append('PATCH success=%s errors=%s' % (r.get('success'), str(r.get('errors'))[:200]))
          except urllib.error.HTTPError as e:
              out.append('PATCH HTTP %s %s' % (e.code, e.read().decode()[:300]))
          except Exception as e:
              out.append('PATCH ERR '+str(e)[:200])
          # 二次读取确认
          try:
              c2=(req(B)['result'].get('source') or {}).get('config') or {}
              out.append('AFTER production_deployments_enabled=%s preview=%s'
                         % (c2.get('production_deployments_enabled'), c2.get('preview_deployment_setting')))
          except Exception as e: out.append('VERIFY ERR '+str(e)[:150])
          # 3. 找最近一个 success 的生产部署，回滚生产别名
          try:
              ds=req(B+'/deployments?per_page=30')['result']
              succ=[d for d in ds if d.get('environment')=='production'
                    and (d.get('latest_stage') or {}).get('status')=='success']
              succ.sort(key=lambda d: d.get('created_on',''), reverse=True)
              out.append('success 部署数 %d' % len(succ))
              if succ:
                  did=succ[0]['id']
                  out.append('rollback 目标 %s %s' % (did[:8], succ[0].get('created_on')))
                  try:
                      rr=req(B+'/deployments/'+did+'/rollback','POST',{})
                      out.append('ROLLBACK success=%s errors=%s' % (rr.get('success'), str(rr.get('errors'))[:200]))
                  except urllib.error.HTTPError as e:
                      out.append('ROLLBACK HTTP %s %s' % (e.code, e.read().decode()[:300]))
          except Exception as e: out.append('deployments ERR '+str(e)[:200])
          # 4. 探测
          time.sleep(20)
          for u in ['https://hnvip.pages.dev/','https://hnvip.pages.dev/data/latest.json']:
              r=subprocess.run(['curl','-sS','-L','--max-time','30','-o','/tmp/b','-w','%{http_code}',u],
                               capture_output=True,text=True,timeout=40)
              body=open('/tmp/b','rb').read()[:200].decode('utf8','replace').replace('\n',' ')
              out.append('curl %s -> %s | %s' % (u.split('/')[-1] or 'root',(r.stdout or '').strip(),body))
          txt='\n'.join(out)+'\n'; print(txt)
          url='https://api.github.com/repos/'+REPO+'/contents/hnvip_fix.txt'
          sha=None
          try:
              r=urllib.request.Request(url,headers={'Authorization':'token '+PAT,'User-Agent':'fix'})
              sha=json.loads(urllib.request.urlopen(r,timeout=30).read()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: out.append('get sha warn '+str(e.code))
          except Exception: pass
          d={'message':'[Skip CI] hnvip fix result','content':base64.b64encode(txt.encode()).decode(),'branch':'main'}
          if sha: d['sha']=sha
          r=urllib.request.Request(url,data=json.dumps(d).encode(),method='PUT',
              headers={'Authorization':'token '+PAT,'User-Agent':'fix','Content-Type':'application/json'})
          try: urllib.request.urlopen(r,timeout=40).read(); print('written')
          except Exception as e: print('write ERR',str(e)[:200])
          PY
