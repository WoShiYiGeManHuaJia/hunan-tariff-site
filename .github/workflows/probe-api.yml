name: Probe API

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tariff-build
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pycryptodome
      - name: 探测源站接口
        run: python -u scripts/probe_api.py
      - name: 用 contents API 写回结果（唯一文件名，避免 sha 冲突）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          F="probe/result_${RUN_ID}.txt"
          if [ ! -f "$F" ]; then
            printf 'PROBE_EMPTY\n' > "$F"
          fi
          python3 - "$F" <<'PY'
          import base64, json, os, sys, urllib.request
          path = sys.argv[1]
          tok = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          content = base64.b64encode(open(path, "rb").read()).decode()
          data = json.dumps({
              "message": "probe: 结果 %s" % path,
              "content": content,
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/contents/%s" % (repo, path),
              data=data, method="PUT",
              headers={"Authorization": "token " + tok,
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "probe-bot"})
          try:
              r = urllib.request.urlopen(req, timeout=60)
              print("写回成功 HTTP", r.status)
          except Exception as e:
              print("写回失败:", str(e)[:200])
          PY
