name: gd-prov-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome -q
      - name: run probe
        run: |
          cat > /tmp/p.py <<'PY'
          import urllib.request, json, time, base64
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad
          KEY=b"telecom_wap_2018"
          UA="Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          API="https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          def enc(m): return base64.b64encode(AES.new(KEY,AES.MODE_ECB).encrypt(pad(m.encode("utf-8"),16))).decode("utf-8")
          def call(fn,rc,to=25):
              body=enc(json.dumps({"headerInfo":{"functionCode":fn},"requestContent":rc},ensure_ascii=False))
              req=urllib.request.Request(API,data=body.encode("utf-8"),method="POST",headers={
                "User-Agent":UA,"Referer":"https://www.189.cn/wapportalweb/rateZone/index.html",
                "Accept":"application/json, text/plain, */*","Content-Type":"text/plain;charset=UTF-8",
                "Origin":"https://www.189.cn","x-qd-reqtime":str(int(time.time()*1000))})
              last=None
              for a in range(2):
                  try:
                      with urllib.request.urlopen(req,timeout=to) as r: return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e; time.sleep(1.5)
              return {"__err":str(last)}
          def home(prov):
              return call("tariffSectionHome",{"ticket":"","sessionid":"","provCode":prov}).get("responseContent",{}) or {}
          h=home("600203")
          print("HUNAN_KEYS="+json.dumps(list(h.keys()),ensure_ascii=False))
          print("HUNAN_RAW="+json.dumps(h,ensure_ascii=False)[:2500])
          print("---SCAN_START---")
          cands=[str(n) for n in range(600100,600400)]
          ok=0; err=0
          for c in cands:
              r=home(c)
              if "__err" in r or not isinstance(r,dict):
                  err+=1
                  if err>40: print("ABORT_TOO_MANY_ERR"); break
                  continue
              boards=r.get("lableOneList") or []
              if not boards: continue
              ok+=1
              meta={k:v for k,v in r.items() if isinstance(v,str) and k!="sessionid" and len(v)<40}
              print("HIT|%s|boards=%d|meta=%s"%(c,len(boards),json.dumps(meta,ensure_ascii=False)))
              time.sleep(0.25)
          print("---SCAN_END--- ok=%d err=%d"%(ok,err))
          PY
          python3 /tmp/p.py
