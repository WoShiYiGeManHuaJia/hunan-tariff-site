name: zz-deploy-hnvip
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆站点
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:$PAT@github.com/${{ github.repository }}.git /tmp/site
          cd /tmp/site && rm -rf .git .github
          echo "总大小: $(du -sh /tmp/site | cut -f1)"
          echo "文件数: $(find /tmp/site -type f | wc -l)"
          echo "大文件(>10MB):"
          find /tmp/site -type f -size +10M -exec ls -lh {} \; | awk '{print $5, $9}'
      - name: 直传部署到 hnvip
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          cd /tmp/site
          python3 - <<'PY'
          import os, json, hashlib, urllib.request, mimetypes
          root='/tmp/site'
          files={}
          skip_ext={'.git','.github'}
          for dp,dn,fn in os.walk(root):
              dn[:] = [d for d in dn if d not in ('.git','.github')]
              for f in fn:
                  p=os.path.join(dp,f)
                  rel=os.path.relpath(p,root).replace(os.sep,'/')
                  sz=os.path.getsize(p)
                  if sz > 24*1024*1024:
                      print('SKIP too big:',rel,sz); continue
                  files['/'+rel]=[hashlib.sha1(open(p,'rb').read()).hexdigest(), sz]
          print('files:',len(files))
          json.dump(files, open('/tmp/manifest.json','w'))
          PY
          python3 - <<'PY'
          import json, os, uuid, urllib.request
          manifest=json.load(open('/tmp/manifest.json'))
          token=os.environ['CF']; acc='9156c2cae565fdf42d208827b523e47e'
          boundary='----x'+uuid.uuid4().hex
          body=b''
          def field(name, val, ctype=None, fname=None):
              b=('--%s\r\n' % boundary).encode()
              if fname:
                  b+=('Content-Disposition: form-data; name="%s"; filename="%s"\r\n' % (name,fname)).encode()
              else:
                  b+=('Content-Disposition: form-data; name="%s"\r\n' % name).encode()
              if ctype: b+=('Content-Type: %s\r\n' % ctype).encode()
              b+=b'\r\n'+val+b'\r\n'
              return b
          body+=field('manifest', json.dumps(manifest).encode(), 'application/json')
          for path,(h,sz) in manifest.items():
              p='/tmp/site'+path
              body+=field(h, open(p,'rb').read(), 'application/octet-stream', h)
          body+=('--%s--\r\n' % boundary).encode()
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{acc}/pages/projects/hnvip/deployments',
              data=body, method='POST')
          req.add_header('Authorization','Bearer '+token)
          req.add_header('Content-Type', 'multipart/form-data; boundary='+boundary)
          try:
              r=urllib.request.urlopen(req, timeout=600)
              print('HTTP', r.status)
              print(r.read().decode()[:800])
          except Exception as e:
              print('ERR:', e)
              try: print(e.read().decode()[:600])
              except: pass
          PY
      - name: 探测
        run: |
          echo "hnvip.pages.dev -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 https://hnvip.pages.dev/ 2>&1)"
          echo "--- 提交 ---"
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/dep4.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"dep4\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/dep4.txt" || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"dep4\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/dep4.txt"
          echo done
