name: cf-dns-setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Cloudflare DNS
        env:
          CF_TOKEN: ${{ secrets.CF_DNS_TOKEN }}
          DOM: hnvip.qd.je
        run: |
          set -u
          T="$CF_TOKEN"
          DOM="$DOM"
          H() { curl -s --max-time 30 -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$1"; }

          echo "===== 1. TOKEN VERIFY ====="
          H "https://api.cloudflare.com/client/v4/user/tokens/verify"
          echo

          echo "===== 2. FIND ZONE ====="
          RES=$(H "https://api.cloudflare.com/client/v4/zones?name=$DOM")
          echo "$RES" | head -c 1200
          echo
          ZID=$(echo "$RES" | jq -r '.result[0].id // empty')

          if [ -z "$ZID" ]; then
            echo "===== 2b. CREATE ZONE ====="
            RES2=$(curl -s --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones" \
              -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d "{\"name\":\"$DOM\",\"jump_start\":false}")
            echo "$RES2" | head -c 1500
            echo
            ZID=$(echo "$RES2" | jq -r '.result.id // empty')
            if [ -z "$ZID" ]; then
              ZID=$(echo "$RES2" | jq -r '.errors[0].data.zone_id // empty')
              echo "(from error) ZID=$ZID"
            fi
          fi
          echo "ZONE_ID=$ZID"

          if [ -z "$ZID" ]; then
            echo "!!!!! NO ZONE ID - STOP !!!!!"
            exit 1
          fi

          echo "===== 3. NAMESERVERS (填回 DigitalPlat 的) ====="
          H "https://api.cloudflare.com/client/v4/zones/$ZID" | jq -r '.result.name_servers[]? // empty'

          echo "===== 4. ADD A RECORDS ====="
          for IP in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            EX=$(H "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?type=A&name=$DOM" \
                 | jq -r --arg ip "$IP" '.result[]? | select(.content==$ip) | .id')
            if [ -n "$EX" ]; then
              echo "A $IP 已存在 id=$EX"
            else
              R=$(curl -s --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" \
                -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$DOM\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":false}")
              echo "A $IP -> $(echo "$R" | jq -r '.success')"
            fi
          done

          echo "===== 5. ADD CNAME www ====="
          EXC=$(H "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?type=CNAME&name=www.$DOM" \
               | jq -r '.result[0].id // empty')
          if [ -n "$EXC" ]; then
            echo "CNAME www 已存在"
          else
            RC=$(curl -s --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" \
              -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"www\",\"content\":\"woshiyigemanhuajia.github.io\",\"ttl\":1,\"proxied\":false}")
            echo "CNAME www -> $(echo "$RC" | jq -r '.success')"
          fi

          echo "===== 6. FINAL RECORDS ====="
          H "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" \
            | jq -r '.result[]? | "\(.type)\t\(.name)\t\(.content)\tproxied=\(.proxied)"'

          echo "===== DONE ====="
