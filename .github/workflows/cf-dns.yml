name: cf-dns-setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Cloudflare DNS
        env:
          CF_TOKEN: ${{ secrets.CF_DNS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOM: hnvip.qd.je
        run: |
          echo '' | base64 -d > /tmp/cf.py
          python3 /tmp/cf.py 2>&1 | tee /tmp/cf.log
          echo "--- done ---"
