name: Mobile Fetch & Build
# 公开仓 Actions 免费不限量（私有仓额度已耗尽）
# 链路：抓快照 → 以 data/ 为基线构建 → 同步站点数据

on:
  schedule:
    - cron: "47 0,12 * * *"    # 北京 08:47 / 20:47
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome

      # 降级判定峰值持久化：Actions 每轮是全新 runner，若不缓存，
      # peaks.json 恒为空 → _evaluate_degrade() 中 _pk 恒为空、confirmed 恒 False，
      # 整套「分类峰值降级判定」写了却从未执行过一次。
      # 只缓存 peaks.json 本身（内部判据，不公开入库，也不改代码路径）。
      - name: 恢复降级峰值缓存
        uses: actions/cache@v4
        with:
          path: pipelines/mobile/snapshots/peaks.json
          key: mobile-peaks-v1
          restore-keys: |
            mobile-peaks-

      - name: 抓取移动资费快照（31省+全网）
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          set -e
          cd pipelines/mobile
          echo "=== 抓取开始 $(date -u +%FT%TZ) ==="
          set +e
          python3 -u main.py --once 2>&1 | tail -80
          EC=${PIPESTATUS[0]}
          set -e
          echo "抓取 exit=$EC"
          ls -la snapshots/ | head -5

      - name: 构建站点数据
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # build_site 固定读 ./snapshots（snapshot.py 输出在 pipelines/mobile/snapshots）
          rm -rf snapshots
          cp -r pipelines/mobile/snapshots ./snapshots
          N=$(ls snapshots/*.json 2>/dev/null | wc -l)
          echo "快照文件数: $N"

          # 防护一：一条都没抓到时，绝不重建/覆盖 data/，只把仪表盘按现有数据重算
          if [ "$N" -eq 0 ]; then
            echo "::error::本轮抓取未产出任何快照（源站异常或网络失败），已保留现有数据"
            python3 scripts/rebuild_latest.py
            rm -rf _site
            exit 0
          fi

          # 基线：公开仓现有 data/ 与 prev 格式完全一致（已比对验证），直接复用
          rm -rf _prev && mkdir -p _prev
          cp -f data/*.json _prev/ 2>/dev/null || true
          echo "基线文件数: $(ls _prev | wc -l)"
          # 公告
          python3 pipelines/scripts/announce_fetch.py --move-dir site/data || true
          # 构建
          python3 scripts/build_site.py 2>&1 | tail -40

          # 防护二：构建结果若为全 0（例如各板块都抓到 0 条），不覆盖现有数据
          QT=$(python3 -c "import json;print(json.load(open('_site/data/latest.json')).get('quanguo_total',0))" 2>/dev/null || echo 0)
          echo "新构建 quanguo_total=$QT"
          if [ "$QT" = "0" ]; then
            echo "::error::新构建结果为 0，放弃覆盖 data/，改用现有数据重建 latest.json"
            python3 scripts/rebuild_latest.py
            rm -rf _site
          fi

      - name: 同步产物到仓库
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # 静态页面（index.html / app.js / style.css / common-extras.js）
          # 不再从 _site 复制回根目录：_site 里的其实是 site/ 旧副本，
          # 覆盖回去会把根目录已修好的版本回滚（如「无变化不占位」）。
          # 根目录文件即 Pages 部署源，由 git 维护。
          mkdir -p data
          cp -f _site/data/*.json data/ 2>/dev/null || true
          rm -f data/peaks.json          # 内部降级判定峰值，不公开
          rm -rf _site _prev snapshots   # 中间产物不入库
          echo "data 文件数: $(ls data | wc -l)"

      - name: 提交
        if: always()
        run: |
          set -e
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a data /tmp/art/ 2>/dev/null || true
          cp -f index.html app.js style.css common-extras.js /tmp/art/ 2>/dev/null || true
          git fetch origin main || true
          git reset --hard FETCH_HEAD || true
          # ── 原子恢复产物 ──
          # 此前 rm -rf 后再 cp 且 cp 带 || true：cp 失败时目录已删，
          # git add -A 会把「data 目录消失」当成正常变更提交上去。
          # 改为先复制 .new、校验存在、再 mv 原子替换；缺失即中止。
          if [ ! -d /tmp/art/data ]; then
            echo "::error::产物目录缺失（/tmp/art/data），中止提交以避免误删线上数据"
            exit 1
          fi
          rm -rf data.new
          cp -a /tmp/art/data ./data.new || { echo "::error::data 复制失败，中止"; exit 1; }
          rm -rf data
          mv data.new data || { echo "::error::data 替换失败，中止"; exit 1; }
          cp -f /tmp/art/index.html /tmp/art/app.js /tmp/art/style.css /tmp/art/common-extras.js . 2>/dev/null || true
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -q -m "mobile fetch+build $(date -u +%FT%TZ)"
            for i in 1 2 3 4 5; do
              if git push origin main; then echo "已推送"; break; fi
              echo "[warn] push 失败，重新对齐后重试 ($i/5)"
              git fetch origin main
              git reset --hard FETCH_HEAD
              cp -a /tmp/art/data/. ./data/ 2>/dev/null || true
              cp -f /tmp/art/index.html /tmp/art/app.js /tmp/art/style.css /tmp/art/common-extras.js . 2>/dev/null || true
              git add -A
              git commit -q -m "mobile fetch+build $(date -u +%FT%TZ) retry$i" || true
              sleep 8
            done
          fi
