name: hnvip-final
on:
  workflow_dispatch:
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: 恢复配置并部署
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,uuid,time,base64,urllib.request,urllib.error,subprocess
          CF=os.environ['CF']; PAT=os.environ['PAT']; REPO=os.environ['GITHUB_REPOSITORY']
          ACC='9156c2cae565fdf42d208827b523e47e'
          B='https://api.cloudflare.com/client/v4/accounts/'+ACC+'/pages/projects/hnvip'
          API=B+'/deployments'
          out=[]
          def cf(url,method='GET',body=None):
              data=json.dumps(body).encode() if body is not None else None
              r=urllib.request.Request(url,data=data,method=method,
                  headers={'Authorization':'Bearer '+CF,'Content-Type':'application/json','User-Agent':'final'})
              try: return json.loads(urllib.request.urlopen(r,timeout=60).read())
              except urllib.error.HTTPError as e: return {'HTTPERR':e.code,'body':e.read().decode()[:300]}
          # 1. 恢复 source.config（dep4 成功时的配置）
          p=cf(B)
          src=(p.get('result') or {}).get('source') or {}
          cfg=dict(src.get('config') or {})
          cfg['production_deployments_enabled']=True
          cfg['deployments_enabled']=True
          rr=cf(B,'PATCH',{'name':'hnvip','source':{'type':src.get('type','github'),'config':cfg}})
          out.append('RESTORE PATCH '+json.dumps(rr,ensure_ascii=False)[:250])
          c2=(cf(B).get('result') or {}).get('source',{}).get('config',{})
          out.append('AFTER prod_enabled=%s depl_enabled=%s' % (c2.get('production_deployments_enabled'),c2.get('deployments_enabled')))
          # 2. 数组格式直传（dep4 验证过的方式）
          root=os.getcwd(); files={}
          for dp,dn,fn in os.walk(root):
              dn[:]=[d for d in dn if d not in ('.git','.github')]
              for f in fn:
                  q=os.path.join(dp,f); rel=os.path.relpath(q,root).replace(os.sep,'/')
                  sz=os.path.getsize(q)
                  if sz>24*1024*1024: continue
                  files['/'+rel]=[hashlib.sha1(open(q,'rb').read()).hexdigest(),sz]
          out.append('files=%d has_index=%s' % (len(files),'/index.html' in files))
          boundary='----x'+uuid.uuid4().hex
          def field(n,v,ct=None,fn=None):
              b=('--%s\r\n'%boundary).encode()
              b+=(('Content-Disposition: form-data; name="%s"; filename="%s"\r\n'%(n,fn)) if fn else ('Content-Disposition: form-data; name="%s"\r\n'%n)).encode()
              if ct: b+=('Content-Type: %s\r\n'%ct).encode()
              return b+b'\r\n'+v+b'\r\n'
          body=field('manifest',json.dumps(files).encode(),'application/json')
          for path,(h,sz) in files.items():
              body+=field(h,open(root+path,'rb').read(),'application/octet-stream',h)
          body+=('--%s--\r\n'%boundary).encode()
          req=urllib.request.Request(API,data=body,method='POST')
          req.add_header('Authorization','Bearer '+CF)
          req.add_header('Content-Type','multipart/form-data; boundary='+boundary)
          try:
              dep=json.loads(urllib.request.urlopen(req,timeout=900).read())['result']
          except urllib.error.HTTPError as e:
              out.append('DEPLOY HTTP %s %s'%(e.code,e.read().decode()[:400])); dep=None
          if dep:
              did=dep['id']; out.append('DEP_ID '+did)
              cf(API+'/'+did+'/retry','POST')
              for i in range(40):
                  time.sleep(10)
                  d=cf(API+'/'+did)
                  st=((d.get('result') or {}).get('latest_stage') or {}).get('status','?')
                  if i%3==0: out.append('stage[%d] %s'%(i,st))
                  if st in ('success','failure','canceled'):
                      out.append('FINAL '+st); break
          # 3. 探测
          time.sleep(25)
          def probe(u):
              r=subprocess.run(['curl','-sS','-L','--max-time','30','-o','/tmp/b','-w','%{http_code}',
                                '-H','User-Agent: Mozilla/5.0',u],capture_output=True,text=True,timeout=40)
              return (r.stdout or '').strip(),open('/tmp/b','rb').read()[:200].decode('utf8','replace').replace('\n',' ')
          for u in ['https://hnvip.pages.dev/','https://hnvip.pages.dev/data/latest.json','https://hnvip.pages.dev/version.json']:
              c,b=probe(u); out.append('curl %s -> %s | %s'%(u.split('/')[-1] or 'root',c,b))
          txt='\n'.join(out)+'\n'; print(txt)
          url='https://api.github.com/repos/'+REPO+'/contents/hnvip_final.txt'
          sha=None
          try:
              q=urllib.request.Request(url,headers={'Authorization':'token '+PAT,'User-Agent':'f'})
              sha=json.loads(urllib.request.urlopen(q,timeout=30).read()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: pass
          except Exception: pass
          d={'message':'[Skip CI] final result','content':base64.b64encode(txt.encode()).decode(),'branch':'main'}
          if sha: d['sha']=sha
          q=urllib.request.Request(url,data=json.dumps(d).encode(),method='PUT',
              headers={'Authorization':'token '+PAT,'User-Agent':'f','Content-Type':'application/json'})
          try: urllib.request.urlopen(q,timeout=40).read(); print('written')
          except Exception as e: print('write ERR',str(e)[:200])
          PY
