name: zz-p4
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 最终验收
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          echo "===== hnvip.pages.dev ====="
          for U in / /manage /manage.html /bm.js /data/latest.json /cmcc.html; do
            echo "  $U -> $(curl -sS -m 25 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' https://hnvip.pages.dev$U)"
          done
          echo "===== 首页是否已含自动重载 ====="
          curl -sS -m 25 -o /tmp/i.html -H "Cache-Control: no-cache" https://hnvip.pages.dev/
          echo "  __swk : $(grep -c '__swk' /tmp/i.html)"
          echo "  size  : $(wc -c < /tmp/i.html)"
          echo "===== manage 页书签地址 ====="
          curl -sS -m 25 -o /tmp/m.html -L https://hnvip.pages.dev/manage.html
          echo "  pages.dev/bm.js : $(grep -c 'hnvip.pages.dev/bm.js' /tmp/m.html)"
          echo "  旧域名残留     : $(grep -c 'hnvip.qd.je' /tmp/m.html)"
          echo "===== bm.js 版本 ====="
          curl -sS -m 25 -o /tmp/b.js https://hnvip.pages.dev/bm.js
          echo "  v2 : $(grep -c '监听 8 秒' /tmp/b.js)  size: $(wc -c < /tmp/b.js)"
          echo DONE
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          curl -sS -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" -d "{\"message\":\"p4\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/p4.txt"
          echo done
