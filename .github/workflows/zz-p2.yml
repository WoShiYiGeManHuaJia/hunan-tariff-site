name: zz-p2
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 验证部署 + 查 Pages
        env:
          PAT: ${{ secrets.GH_PAT }}
          CFT: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          echo "===== 部署验证 ====="
          for U in https://hnvip.pages.dev/bm.js https://hnvip.pages.dev/manage.html https://hnvip.pages.dev/ https://hnvip.pages.dev/data/latest.json; do
            R=$(curl -sS -m 25 -o /tmp/b -w "%{http_code} %{size_download}" -H "Cache-Control: no-cache" "$U")
            echo "  $U -> $R"
            case "$U" in
              *bm.js) echo "    v2特征: $(grep -c '监听 8 秒' /tmp/b 2>/dev/null)";;
              *manage.html) echo "    pages.dev引用: $(grep -c 'hnvip.pages.dev/bm.js' /tmp/b 2>/dev/null)";;
              *latest.json) python3 -c "
          import json
          d=json.load(open('/tmp/b'))
          print('    quanguo_total=',d.get('quanguo_total'),'prov_total=',d.get('prov_total'),'hunan_total=',d.get('hunan_total'))
          ";;
            esac
          done
          echo "===== Cloudflare Pages ====="
          for A in $(curl -sS -m 20 -H "Authorization: Bearer $CFT" "https://api.cloudflare.com/client/v4/accounts" 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(' '.join(a['id'] for a in d.get('result',[])))
          except Exception as e: print('')"); do
            echo "  account: $A"
            curl -sS -m 25 -H "Authorization: Bearer $CFT" "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects" 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            for p in d.get('result',[]):
              print('    project:', p.get('name'), '|', p.get('subdomain'), '|', (p.get('source') or {}).get('config',{}).get('owner'), (p.get('source') or {}).get('config',{}).get('repo_name'), (p.get('source') or {}).get('config',{}).get('production_branch'))
              print('      build:', (p.get('build_config') or {}))
          except Exception as e: print('    err', e)
          "
          done
          echo DONE
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          curl -sS -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" -d "{\"message\":\"p2\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/p2.txt"
          echo done
