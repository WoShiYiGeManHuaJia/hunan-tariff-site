name: chk2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查
        run: |
          cat > /tmp/chk.py <<'PYEOF'
          import urllib.request, ssl
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          out = []
          urls = ["http://hnvip.qd.je/yun.html",
                  "https://cdn.jsdelivr.net/gh/WoShiYiGeManHuaJia/hunan-tariff-site@main/yun.html"]
          for u in urls:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'}), timeout=40, context=ctx)
                  t = r.read().decode('utf-8','ignore')
                  out.append("%s -> HTTP %s , %d bytes" % (u, r.status, len(t)))
                  out.append("  hasAccMgr: %d" % t.count('号码与 Cookie'))
                  out.append("  hasParse : %d" % t.count('parseCookie'))
                  out.append("  hasBmk   : %d" % t.count('document.cookie'))
                  out.append("  realPhone: %d" % sum(t.count(x) for x in ['13787464642','17289519953','18289484895','13717306553']))
                  out.append("  demoPhone: %s" % sorted(set(__import__('re').findall(r'138\*{4}000\d', t))))
              except Exception as e:
                  out.append("%s -> ERR %s" % (u, str(e)[:70]))
          open('chk2.txt','w').write("\n".join(out))
          print("\n".join(out))
          PYEOF
          python3 /tmp/chk.py
      - name: 回写
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64,json,urllib.request,os
          tok=os.environ['GH_TOKEN']; repo="${{ github.repository }}"
          H={'Authorization':'token '+tok,'User-Agent':'x','Accept':'application/vnd.github+json'}
          b=base64.b64encode(open('chk2.txt','rb').read()).decode()
          sha=None
          try:
              d=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/%s/contents/chk2.txt?ref=main'%repo,headers=H),timeout=60)); sha=d.get('sha')
          except Exception: pass
          pl={'message':'c','content':b,'branch':'main'}
          if sha: pl['sha']=sha
          urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/%s/contents/chk2.txt'%repo,data=json.dumps(pl).encode(),method='PUT',headers=H),timeout=120)
          print('回写完成')
          PYEOF
