name: hnvip-purge
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: 清空部署并重建
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/hnvip_purge.py
