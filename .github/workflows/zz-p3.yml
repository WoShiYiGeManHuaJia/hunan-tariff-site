name: zz-p3
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 对比线上与仓库 index.html
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          curl -sS -m 30 -o /tmp/online.html -H "Cache-Control: no-cache" "https://hnvip.pages.dev/"
          echo "online / size: $(wc -c < /tmp/online.html)"
          echo "online head:"
          head -c 300 /tmp/online.html
          echo ""
          echo "===== 线上是否读 quanguo_total ====="
          for K in quanguo_total prov_total hunan_total prov_stats def_dist sections latest.json announce.json; do
            echo "  $K : $(grep -c "$K" /tmp/online.html)"
          done
          echo "===== 仓库 main 的 index.html ====="
          curl -sS -m 30 -H "Authorization: token $PAT" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/WoShiYiGeManHuaJia/hunan-tariff-site/contents/index.html" -o /tmp/repo.html
          echo "repo index size: $(wc -c < /tmp/repo.html)"
          echo "md5 online: $(md5sum /tmp/online.html | cut -d' ' -f1)"
          echo "md5 repo  : $(md5sum /tmp/repo.html | cut -d' ' -f1)"
          echo "===== _headers ====="
          curl -sS -m 25 -H "Authorization: token $PAT" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/WoShiYiGeManHuaJia/hunan-tariff-site/contents/_headers"
          echo ""
          echo "===== manage.html 跳转 ====="
          curl -sS -m 25 -o /dev/null -w "manage: %{http_code} -> %{redirect_url}\n" "https://hnvip.pages.dev/manage.html"
          curl -sS -m 25 -o /dev/null -w "bm.js: %{http_code}\n" "https://hnvip.pages.dev/bm.js"
          echo DONE
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          curl -sS -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" -d "{\"message\":\"p3\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/p3.txt"
          echo done
