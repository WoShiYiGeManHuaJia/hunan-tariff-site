name: backfill-removed-details

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/backfill_removed.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A
          if git diff --cached --quiet; then
            echo "无改动"
          else
            git commit -m "backfill: 回填历史变更中未存快照的业务字段"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push; then echo "push ok"; break; fi
              sleep 12
            done
          fi
