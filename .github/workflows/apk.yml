name: Build YunTok APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'yuntok/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          chmod +x /opt/gradle-8.2/bin/gradle
      - name: Build (捕获编译错误)
        working-directory: ./yuntok
        run: |
          mkdir -p ../data
          : > ../data/buildlog.txt
          /opt/gradle-8.2/bin/gradle assembleDebug --no-daemon > /tmp/b.log 2>&1
          echo "gradle exit=$?" >> ../data/buildlog.txt
          grep -nE "error:|error\s*:|\.java:[0-9]+|FAILED|Compilation failed" /tmp/b.log | head -60 >> ../data/buildlog.txt
          echo "----- tail -----" >> ../data/buildlog.txt
          tail -40 /tmp/b.log >> ../data/buildlog.txt
          cat ../data/buildlog.txt
      - name: Publish APK
        run: |
          # 只从构建产物目录取，绝不全局 find（避免被仓库内旧副本覆盖）
          SRC=yuntok/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$SRC" ]; then
            cp "$SRC" yuntok.apk
            ls -l yuntok.apk; md5sum yuntok.apk
          else
            echo "NO_APK (build failed)" > data/noapk.txt
          fi
      - name: Commit
        run: |
          git config user.name zz
          git config user.email zz@x.com
          git add -f yuntok.apk data/buildlog.txt data/noapk.txt 2>/dev/null || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: yuntok 构建产物与日志 ($(date -u +%Y%m%d-%H%M))"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin main && exit 0; sleep 6; done
          exit 1
