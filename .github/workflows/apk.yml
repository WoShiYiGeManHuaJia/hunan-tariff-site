name: Build YunTok APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          chmod +x /opt/gradle-8.2/bin/gradle
      - name: Build
        working-directory: ./yuntok
        run: |
          mkdir -p ../data
          TS=$(date -u +%Y%m%d-%H%M%S)
          { echo "=== BUILD $TS ==="; } > ../data/buildlog.txt
          /opt/gradle-8.2/bin/gradle assembleDebug --no-daemon > /tmp/b.log 2>&1
          echo "gradle_exit=$?" >> ../data/buildlog.txt
          echo "--- errors ---" >> ../data/buildlog.txt
          grep -nE "error:|\.java:[0-9]+|FAILED|Compilation failed|What went wrong" -A3 /tmp/b.log | head -80 >> ../data/buildlog.txt
          echo "--- tail 60 ---" >> ../data/buildlog.txt
          tail -60 /tmp/b.log >> ../data/buildlog.txt
      - name: Publish
        run: |
          rm -f yuntok.apk
          SRC=yuntok/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$SRC" ]; then
            cp "$SRC" yuntok.apk
            echo "APK_OK $(stat -c%s yuntok.apk) md5=$(md5sum yuntok.apk|cut -c1-8)" >> data/buildlog.txt
          else
            echo "APK_MISSING" >> data/buildlog.txt
          fi
      - name: Commit
        run: |
          git config user.name zz
          git config user.email zz@x.com
          git add -f data/buildlog.txt
          if [ -f yuntok.apk ]; then git add -f yuntok.apk; else git rm -f --cached yuntok.apk 2>/dev/null || true; fi
          git commit -m "chore: yuntok build $(date -u +%Y%m%d-%H%M%S)"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin main && exit 0; sleep 6; done
          exit 1
