name: hnvip-probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: 多通道探测
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,base64,urllib.request,urllib.error
          PAT=os.environ['PAT']; REPO=os.environ['GITHUB_REPOSITORY']
          urls=[
            'https://hnvip.pages.dev/',
            'https://hnvip.pages.dev/data/latest.json',
            'https://1642b3a4.hnvip.pages.dev/',
            'https://1642b3a4.hnvip.pages.dev/data/latest.json',
            'https://hunan-tariff-site.pages.dev/',
            'https://www.cloudflare.com/',
          ]
          out=[]
          for u in urls:
              r=subprocess.run(['curl','-sS','-L','--max-time','25','-D','/tmp/h','-o','/tmp/b',
                                '-w','%{http_code}','-H','User-Agent: Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36',u],
                               capture_output=True,text=True,timeout=35)
              h=open('/tmp/h','rb').read().decode('utf8','replace').splitlines()
              keep=[x for x in h if any(k in x.lower() for k in ['http/','server:','cf-ray','content-type','cache-control','location:'])]
              b=open('/tmp/b','rb').read()[:180].decode('utf8','replace').replace('\n',' ')
              out.append('%s -> %s\n   %s\n   %s' % (u,(r.stdout or '').strip(),' | '.join(keep[-6:]),b))
          txt='\n'.join(out)+'\n'; print(txt)
          url='https://api.github.com/repos/'+REPO+'/contents/hnvip_probe.txt'
          sha=None
          try:
              q=urllib.request.Request(url,headers={'Authorization':'token '+PAT,'User-Agent':'p'})
              sha=json.loads(urllib.request.urlopen(q,timeout=30).read()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: pass
          except Exception: pass
          d={'message':'[Skip CI] probe','content':base64.b64encode(txt.encode()).decode(),'branch':'main'}
          if sha: d['sha']=sha
          q=urllib.request.Request(url,data=json.dumps(d).encode(),method='PUT',
              headers={'Authorization':'token '+PAT,'User-Agent':'p','Content-Type':'application/json'})
          try: urllib.request.urlopen(q,timeout=40).read(); print('written')
          except Exception as e: print('write ERR',str(e)[:200])
          PY
