name: hnvip-probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: 打印项目完整配置
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          CF=os.environ['CF']; PAT=os.environ['PAT']; REPO=os.environ['GITHUB_REPOSITORY']
          ACC='9156c2cae565fdf42d208827b523e47e'
          B='https://api.cloudflare.com/client/v4/accounts/'+ACC+'/pages/projects/hnvip'
          def get(u):
              r=urllib.request.Request(u,headers={'Authorization':'Bearer '+CF,'User-Agent':'probe'})
              return json.loads(urllib.request.urlopen(r,timeout=40).read())['result']
          p=get(B)
          out=[]
          for k in ['name','subdomain','domains','created_on','production_branch','uses_functions']:
              out.append('%s = %s' % (k,str(p.get(k))[:200]))
          out.append('source = '+json.dumps(p.get('source'),ensure_ascii=False)[:600])
          out.append('build_config = '+json.dumps(p.get('build_config'),ensure_ascii=False)[:600])
          out.append('deployment_configs = '+json.dumps(p.get('deployment_configs'),ensure_ascii=False)[:800])
          ld=p.get('latest_deployment') or {}
          out.append('latest_deployment = '+json.dumps({k:ld.get(k) for k in ['id','environment','aliases','created_on','latest_stage','deployment_trigger']},ensure_ascii=False)[:400])
          # 找带 aliases 的部署
          try:
              ds=get(B+'/deployments?per_page=12')
              out.append('--- aliases ---')
              for d in ds[:12]:
                  if d.get('aliases'):
                      out.append(' %s %s %s aliases=%s' % (str(d.get('id'))[:8],
                          (d.get('latest_stage') or {}).get('status'), d.get('created_on'), d.get('aliases')))
          except Exception as e: out.append('deployments ERR '+str(e)[:200])
          txt='\n'.join(out)+'\n'; print(txt)
          url='https://api.github.com/repos/'+REPO+'/contents/hnvip_probe.txt'
          sha=None
          try:
              q=urllib.request.Request(url,headers={'Authorization':'token '+PAT,'User-Agent':'p'})
              sha=json.loads(urllib.request.urlopen(q,timeout=30).read()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: pass
          except Exception: pass
          d={'message':'[Skip CI] project config','content':base64.b64encode(txt.encode()).decode(),'branch':'main'}
          if sha: d['sha']=sha
          q=urllib.request.Request(url,data=json.dumps(d).encode(),method='PUT',
              headers={'Authorization':'token '+PAT,'User-Agent':'p','Content-Type':'application/json'})
          try: urllib.request.urlopen(q,timeout=40).read(); print('written')
          except Exception as e: print('write ERR',str(e)[:200])
          PY
