name: zz-rescue-hnvip
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: diagnose build failure
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          ACC=9156c2cae565fdf42d208827b523e47e
          O=/tmp/rescue.txt
          exec > >(tee -a $O) 2>&1
          echo "=== [1] latest failure deployment full stages ==="
          curl -sS -m 40 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments?page=1&per_page=25" -o /tmp/l.json
          FID=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/l.json'))
          for x in (d.get('result') or []):
              ls=(x.get('latest_stage') or {}).get('status')
              if ls=='failure':
                  print(x['id']); break
          else: print('')
          PY
          )
          echo "fail_id=$FID"
          if [ -n "$FID" ]; then
            curl -sS -m 40 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments/$FID" -o /tmp/fd.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/fd.json'));r=d.get('result') or {}
          print('trigger=',str(r.get('deployment_trigger'))[:250])
          for s in r.get('stages') or []:
              print('stage=',s.get('name'),'status=',s.get('status'),'msg=',str(s.get('message'))[:300],'started=',s.get('started_on'),'ended=',s.get('ended_on'))
          PY
            echo "--- logs endpoint ---"
            curl -sS -m 40 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments/$FID/logs" | head -c 2500; echo
          fi
          echo "=== [2] repo files over 8MB ==="
          curl -sS -m 60 -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/trees/main?recursive=1" -o /tmp/tree.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tree.json'))
          t=d.get('tree') or []
          print('tree_count=',len(t),'truncated=',d.get('truncated'))
          big=[(x.get('path'),x.get('size',0)) for x in t if x.get('type')=='blob' and x.get('size',0)>8*1024*1024]
          big.sort(key=lambda k:-k[1])
          for p,s in big[:30]: print(round(s/1024/1024,1),'MB',p)
          print('big_count=',len(big),'total_MB=',round(sum(s for _,s in big)/1024/1024,1))
          PY
          echo "=== [3] root dirs sizes (approx) ==="
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/tree.json'))
          agg=collections.Counter()
          for x in d.get('tree') or []:
              if x.get('type')=='blob':
                  top=x.get('path','').split('/')[0]
                  agg[top]+=x.get('size',0)
          for k,v in agg.most_common(12): print(round(v/1024/1024,1),'MB',k)
          PY
          echo "=== [4] verify site still 200 ==="
          curl -sS -m 30 -o /dev/null -w "hnvip.pages.dev -> %{http_code}\n" -L "https://hnvip.pages.dev/?cb=$RANDOM" 2>&1
          echo "=== [5] save log ==="
          B64=$(base64 -w0 /tmp/rescue.txt)
          SHA=$(curl -sS -m 20 -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/rescue.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          curl -sS -m 30 -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"rescue7\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/rescue.txt" | head -c 120; echo
