name: zz-rescue-hnvip
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: diagnose 500
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          ACC=9156c2cae565fdf42d208827b523e47e
          O=/tmp/rescue.txt
          exec > >(tee -a $O) 2>&1
          echo "=== [1] raw 500 response ==="
          curl -sS -i -m 30 "https://hnvip.pages.dev/?diag=1" | head -c 2000; echo
          echo "=== [2] canonical deployment stages ==="
          curl -sS -m 30 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments/0b74e23a-aecc-4088-9deb-cc32b0920be3" -o /tmp/dep.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/dep.json'));r=d.get('result') or {}
          print('trigger=',str(r.get('deployment_trigger'))[:200])
          for s in r.get('stages') or []:
              print('stage',s.get('name'),s.get('status'),str(s.get('message'))[:200])
          PY
          echo "=== [3] repo root special entries ==="
          curl -sS -m 30 -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/" -o /tmp/root.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/root.json'))
          keys=('function','worker','redirect','package.json','package-lock','node_modules','.npm','wrangler','toml')
          for x in d:
              n=x['name'].lower()
              if any(k in n for k in keys) or x['type']=='dir':
                  print(x['type'],x['name'])
          PY
          echo "=== [4] try patch source to ad_hoc ==="
          for BODY in '{"source":{"type":"ad_hoc"}}' '{"source":null}' '{"production_branch":"main","source":{"type":"ad_hoc"}}'; do
            echo "-- $BODY"
            curl -sS -m 30 -X PATCH -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
              -d "$BODY" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip" | head -c 350; echo
          done
          echo "=== [5] project source now ==="
          curl -sS -m 30 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip" -o /tmp/p5.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/p5.json'));r=d.get('result') or {}
          print('source=',json.dumps(r.get('source'),ensure_ascii=False)[:400])
          cd=r.get('canonical_deployment') or {}
          print('canonical=',cd.get('short_id'),(cd.get('latest_stage') or {}).get('status'))
          PY
          echo "=== [6] verify ==="
          for i in 1 2 3; do
            curl -sS -m 30 -o /dev/null -w "hnvip.pages.dev -> %{http_code}\n" -L "https://hnvip.pages.dev/?cb=$RANDOM" 2>&1
            sleep 5
          done
          echo "=== [7] save log ==="
          B64=$(base64 -w0 /tmp/rescue.txt)
          SHA=$(curl -sS -m 20 -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/rescue.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          curl -sS -m 30 -X PUT -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"rescue5\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/rescue.txt" | head -c 120; echo
