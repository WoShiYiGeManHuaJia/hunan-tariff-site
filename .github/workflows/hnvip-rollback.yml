name: hnvip-rollback
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: 回滚到已成功的直传部署
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, subprocess, base64, time
          CF=os.environ['CF']; PAT=os.environ['PAT']; REPO=os.environ['GITHUB_REPOSITORY']
          ACC='9156c2cae565fdf42d208827b523e47e'
          B='https://api.cloudflare.com/client/v4/accounts/'+ACC+'/pages/projects/hnvip'
          out=[]
          def call(url,method='GET',body=None):
              data=json.dumps(body).encode() if body is not None else None
              r=urllib.request.Request(url,data=data,method=method,
                  headers={'Authorization':'Bearer '+CF,'User-Agent':'rollback'})
              try:
                  return json.loads(urllib.request.urlopen(r,timeout=60).read())
              except urllib.error.HTTPError as e:
                  return {'HTTPERR':e.code,'body':e.read().decode()[:400]}
          # 最近一次 stage=success 的直传部署（来自 hnvip_live_state.txt）
          DID='1642b3a4-83db-4d5a-908a-2b017289b023'
          r=call(B+'/deployments/'+DID+'/rollback','POST')
          out.append('ROLLBACK '+DID[:8]+' -> '+json.dumps(r,ensure_ascii=False)[:400])
          # 项目当前生产指向
          p=call(B)
          if 'result' in p:
              ld=p['result'].get('latest_deployment') or {}
              out.append('latest_deployment %s stage=%s %s' % (str(ld.get('id'))[:8],
                  (ld.get('latest_stage') or {}).get('status'), ld.get('created_on')))
          else: out.append('project -> '+str(p)[:200])
          time.sleep(25)
          for u in ['https://hnvip.pages.dev/','https://hnvip.pages.dev/data/latest.json']:
              rr=subprocess.run(['curl','-sS','-L','--max-time','30','-o','/tmp/b','-w','%{http_code}',u],
                                capture_output=True,text=True,timeout=40)
              body=open('/tmp/b','rb').read()[:220].decode('utf8','replace').replace('\n',' ')
              out.append('curl %s -> %s | %s' % (u.split('/')[-1] or 'root',(rr.stdout or '').strip(),body))
          txt='\n'.join(out)+'\n'; print(txt)
          url='https://api.github.com/repos/'+REPO+'/contents/hnvip_fix.txt'
          sha=None
          try:
              q=urllib.request.Request(url,headers={'Authorization':'token '+PAT,'User-Agent':'rb'})
              sha=json.loads(urllib.request.urlopen(q,timeout=30).read()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: pass
          except Exception: pass
          d={'message':'[Skip CI] rollback result','content':base64.b64encode(txt.encode()).decode(),'branch':'main'}
          if sha: d['sha']=sha
          q=urllib.request.Request(url,data=json.dumps(d).encode(),method='PUT',
              headers={'Authorization':'token '+PAT,'User-Agent':'rb','Content-Type':'application/json'})
          try: urllib.request.urlopen(q,timeout=40).read(); print('written')
          except Exception as e: print('write ERR',str(e)[:200])
          PY
