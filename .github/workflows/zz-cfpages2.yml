name: zz-cfpages2
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 跑并保存全部输出
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          for NAME in hnvip hnvip-tariff hnvip-site; do
            echo "===== 创建项目 $NAME ====="
            curl -sS -m 30 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
              -d "{\"name\":\"$NAME\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              r=d['result']; print(' OK:',r.get('name'),'| subdomain:',r.get('subdomain'))
          else: print(' FAIL:',json.dumps(d.get('errors'),ensure_ascii=False)[:300])
          "
          done
          echo "===== 已有项目列表 ====="
          curl -sS -m 30 -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print(' total:',len(d['result']))
              for p in d['result']: print('  ',p['name'],'| subdomain:',p.get('subdomain'))
          else: print(' err:',json.dumps(d.get('errors'),ensure_ascii=False)[:250])
          "
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/cfp2.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"cfp2\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/cfp2.txt" \
          || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"cfp2\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/cfp2.txt"
          echo done
