name: hnvip-recover
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: 定位可用部署并恢复生产
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,subprocess,base64,time
          CF=os.environ['CF']; PAT=os.environ['PAT']; REPO=os.environ['GITHUB_REPOSITORY']
          ACC='9156c2cae565fdf42d208827b523e47e'
          B='https://api.cloudflare.com/client/v4/accounts/'+ACC+'/pages/projects/hnvip'
          out=[]
          def call(url,method='GET',body=None):
              data=json.dumps(body).encode() if body is not None else None
              r=urllib.request.Request(url,data=data,method=method,
                  headers={'Authorization':'Bearer '+CF,'User-Agent':'recover'})
              try: return json.loads(urllib.request.urlopen(r,timeout=60).read())
              except urllib.error.HTTPError as e: return {'HTTPERR':e.code,'body':e.read().decode()[:300]}
          def probe(u):
              r=subprocess.run(['curl','-sS','-L','--max-time','25','-o','/tmp/b','-w','%{http_code}',
                                '-H','User-Agent: Mozilla/5.0',u],capture_output=True,text=True,timeout=35)
              return (r.stdout or '').strip(), open('/tmp/b','rb').read()[:120].decode('utf8','replace').replace('\n',' ')
          # 1. 列出部署 + aliases
          ds=call(B+'/deployments?per_page=12')
          if 'result' in ds:
              for d in ds['result'][:8]:
                  out.append('%s %s %s aliases=%s' % (str(d.get('id'))[:8],
                      (d.get('latest_stage') or {}).get('status'), d.get('created_on'),
                      str(d.get('aliases'))[:80]))
          else: out.append('deployments -> '+str(ds)[:300])
          # 2. 探测几个部署专属 URL
          for sid in ['df22126a','1642b3a4','af1cd44f']:
              c,b=probe('https://'+sid+'.hnvip.pages.dev/')
              out.append('probe %s -> %s | %s' % (sid,c,b))
          c,b=probe('https://hnvip.pages.dev/'); out.append('probe ROOT -> %s | %s' % (c,b))
          # 3. 强制回滚到最新 success 部署
          target='df22126a-37cf-4654-9bc9-2ece67fc51c6'
          rr=call(B+'/deployments/'+target+'/rollback','POST')
          out.append('ROLLBACK '+target[:8]+' -> '+json.dumps(rr,ensure_ascii=False)[:300])
          time.sleep(25)
          c,b=probe('https://hnvip.pages.dev/'); out.append('AFTER ROOT -> %s | %s' % (c,b))
          c,b=probe('https://hnvip.pages.dev/data/latest.json'); out.append('AFTER latest -> %s | %s' % (c,b))
          txt='\n'.join(out)+'\n'; print(txt)
          url='https://api.github.com/repos/'+REPO+'/contents/hnvip_fix.txt'
          sha=None
          try:
              q=urllib.request.Request(url,headers={'Authorization':'token '+PAT,'User-Agent':'r'})
              sha=json.loads(urllib.request.urlopen(q,timeout=30).read()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: pass
          except Exception: pass
          d={'message':'[Skip CI] recover result','content':base64.b64encode(txt.encode()).decode(),'branch':'main'}
          if sha: d['sha']=sha
          q=urllib.request.Request(url,data=json.dumps(d).encode(),method='PUT',
              headers={'Authorization':'token '+PAT,'User-Agent':'r','Content-Type':'application/json'})
          try: urllib.request.urlopen(q,timeout=40).read(); print('written')
          except Exception as e: print('write ERR',str(e)[:200])
          PY
