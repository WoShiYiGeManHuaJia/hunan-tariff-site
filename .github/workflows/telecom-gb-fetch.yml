name: Telecom & GB Fetch
# 公开仓 Actions 免费不限量（私有仓额度已耗尽）
# 单 job 顺序执行：电信 → 广电 → 统一提交，避免并行 push 冲突

on:
  schedule:
    - cron: "17 1,13 * * *"    # 北京 09:17 / 21:17
  workflow_dispatch:
    inputs:
      mode:
        description: "抓取模式（留空则跟随仓库变量 SCRAPE_MODE）"
        type: choice
        options: [focus, full, default]
        default: default
      focus_provs:
        description: "重点省份（focus 模式生效，拼音逗号分隔，如 hunan,guangdong）"
        type: string
        default: ""
      gb_provs:
        description: "广电省份（focus 模式生效，拼音逗号分隔，如 hunan,guangdong,shandong,henan）"
        type: string
        default: ""
      rebuild:
        description: "重建基线（跳过对比，不写历史）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telecom-gb-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome

      - name: 电信 + 广电抓取
        run: |
          set -e
          mkdir -p telecom/data gb/data
          FLAG=""
          if [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            FLAG="--rebuild"
            echo "[]" > telecom/data/history.json
            echo "[]" > gb/data/history.json
          fi
          # ── 抓取模式 ──
          # focus: 只抓 全网 + 重点两省
          # full : 全部板块
          # 手动选 default（或定时触发）时跟随仓库变量 SCRAPE_MODE / FOCUS_PROVS。
          # 注：电信源站仅公开 quanguo 与 hunan 两个板块（其余省 h5 受瑞数 WAF
          # 拦截、provCode 无公开口径），因此模式对电信无实际影响，它始终抓
          # 这两个板块；模式只作用于广电。
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] || [ "$MODE" = "default" ] && MODE="${{ vars.SCRAPE_MODE }}"
          [ -n "$MODE" ] || MODE="full"
          FOCUS="${{ github.event.inputs.focus_provs }}"
          [ -n "$FOCUS" ] || FOCUS="${{ vars.FOCUS_PROVS }}"
          [ -n "$FOCUS" ] || FOCUS="hunan,guangdong"
          # ── 广电省份独立配置（与电信分开）──
          # 广电源站公开 34 个板块（全网 + 31 省 + 深圳），focus 模式下只抓这里列出的省。
          # 加省请改仓库变量 GB_PROVS 或手动触发时填 gb_provs，逗号分隔。
          GBP="${{ github.event.inputs.gb_provs }}"
          [ -n "$GBP" ] || GBP="${{ vars.GB_PROVS }}"
          [ -n "$GBP" ] || GBP="hunan,guangdong,shandong,henan"
          # 兜底：每周日跑一次全量，避免 focus 模式下其余省份永远不更新
          DOW=$(date -u +%u)
          if [ "$DOW" = "7" ]; then
            echo "（周日）强制全量"
            MODE="full"
          fi
          # 广电为全国统一口径：只抓 quanguo（全国）板块，永不抓任何省份
          GB_SCOPE="--scopes quanguo"
          echo "模式: 广电仅全国（quanguo）"
          echo "=== 开始 $(date -u +%FT%TZ) ===" > tg_run.log
          echo "模式=$MODE 重点省=$FOCUS 广电省=$GBP" >> tg_run.log

          set +e
          echo "--- 电信 ---" >> tg_run.log
          PYTHONPATH=pipelines python3 -u pipelines/telecom_pipeline.py \
            --prev-dir telecom/data --out-dir telecom/data $FLAG >> tg_run.log 2>&1
          EC_T=$?
          echo "电信 exit=$EC_T" >> tg_run.log

          # ── 电信湖南公告（provinceCode=600203，只保留最新 15 条，按日期降序）──
          # 抓空不落盘（脚本内保证），故失败不会清空线上公告，不阻断主流程。
          echo "--- 电信公告 ---" >> tg_run.log
          PYTHONPATH=pipelines python3 -u pipelines/scripts/announce_fetch.py \
            --tc-dir telecom/data >> tg_run.log 2>&1
          echo "电信公告 exit=$?" >> tg_run.log

          echo "--- 广电 ---" >> tg_run.log
          PYTHONPATH=pipelines python3 -u pipelines/gb_pipeline.py \
            --prev-dir gb/data --out-dir gb/data $GB_SCOPE $FLAG >> tg_run.log 2>&1
          EC_G=$?
          echo "广电 exit=$EC_G" >> tg_run.log
          set -e

          echo "--- 结束 $(date -u +%FT%TZ) ---" >> tg_run.log
          tail -70 tg_run.log
          echo "EC_T=$EC_T EC_G=$EC_G"
          if [ "$EC_T" -ne 0 ] || [ "$EC_G" -ne 0 ]; then echo "::error::电信/广电管线失败"; exit 1; fi

      - name: 提交
        if: always()
        run: |
          set -e
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a telecom /tmp/art/ 2>/dev/null || true
          cp -a gb /tmp/art/ 2>/dev/null || true
          cp -f tg_run.log /tmp/art/ 2>/dev/null || true
          git fetch origin main || true
          git reset --hard FETCH_HEAD || true
          # ── 原子恢复产物 ──
          # 此前 rm -rf 后再 cp 且 cp 带 || true：cp 失败时目录已删，
          # git add -A 会把「数据目录消失」当成正常变更提交。
          # 改为先复制 .new、校验存在、再 mv 原子替换；缺失即中止。
          for d in telecom gb; do
            if [ ! -d "/tmp/art/$d" ]; then
              echo "::error::产物目录缺失（/tmp/art/$d），中止提交以避免误删线上数据"
              exit 1
            fi
          done
          rm -rf telecom.new gb.new
          cp -a /tmp/art/telecom ./telecom.new || { echo "::error::telecom 复制失败，中止"; exit 1; }
          cp -a /tmp/art/gb ./gb.new || { echo "::error::gb 复制失败，中止"; exit 1; }
          rm -rf telecom gb
          mv telecom.new telecom || { echo "::error::telecom 替换失败，中止"; exit 1; }
          mv gb.new gb || { echo "::error::gb 替换失败，中止"; exit 1; }
          cp -f /tmp/art/tg_run.log ./tg_run.log 2>/dev/null || true
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 日志仅留在工作区供本轮 tail 查看，不再提交（此前 git add -f 会绕过 .gitignore）
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -q -m "telecom+gb fetch $(date -u +%FT%TZ)"
            PUSHED=0
            for i in 1 2 3 4 5; do
              if git push origin main; then echo "已推送"; PUSHED=1; break; fi
              echo "[warn] push 失败，重新对齐后重试 ($i/5)"
              git fetch origin main
              git reset --hard FETCH_HEAD
              cp -a /tmp/art/telecom/. ./telecom/ 2>/dev/null || true
              cp -a /tmp/art/gb/. ./gb/ 2>/dev/null || true
              cp -f /tmp/art/tg_run.log ./tg_run.log 2>/dev/null || true
              git add -A
              git commit -q -m "telecom+gb fetch $(date -u +%FT%TZ) retry$i" || true
              sleep 8
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::error::连续5次 git push 均失败"
              exit 1
            fi
          fi
