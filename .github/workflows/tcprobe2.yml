name: TCProbe2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: pip install pycryptodome -q
      - name: Probe2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, base64, os, re, time, gzip, random
          from Crypto.Cipher import AES, PKCS1_v1_5
          from Crypto.PublicKey import RSA
          from Crypto.Util.Padding import pad
          UA = "Mozilla/5.0 (Linux; Android 13; SM-S9110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          out=[]
          def P(s):
              print(s); out.append(str(s))
          QP = ""
          PUB = RSA.import_key(base64.b64decode(QP))
          def gen(): return "".join("%x"%random.randint(0,15) for _ in range(32))
          def enc_body(o):
              key=os.urandom(16); iv=os.urandom(16)
              ct=AES.new(key,AES.MODE_CBC,iv).encrypt(pad(json.dumps(o,ensure_ascii=False).encode(),16))
              inner=json.dumps({"key":base64.b64encode(key).decode(),"iv":base64.b64encode(iv).decode()},separators=(",",":"))
              return {"param":base64.b64encode(ct).decode(),"key":base64.b64encode(PKCS1_v1_5.new(PUB).encrypt(inner.encode())).decode()}
          def rpost(url,o,timeout=25,fcode="Y121043001"):
              h={"User-Agent":UA,"Content-Type":"application/json;charset=UTF-8","Accept":"application/json, text/plain, */*",
                 "Origin":"https://www.189.cn","Referer":"https://www.189.cn/web/notice/index.html","Fcode":fcode,
                 "TransactionId":gen(),"Accept-Language":"zh-CN,zh;q=0.9"}
              req=urllib.request.Request(url,data=json.dumps(enc_body(o),separators=(",",":")).encode(),headers=h,method="POST")
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  raw=r.read()
                  if r.headers.get("Content-Encoding")=="gzip": raw=gzip.decompress(raw)
                  return json.loads(raw.decode("utf-8","replace"))
          def rget(url,timeout=25,ref="https://www.189.cn/web/notice/index.html"):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*","Accept-Language":"zh-CN,zh;q=0.9","Referer":ref})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  raw=r.read()
                  if r.headers.get("Content-Encoding")=="gzip": raw=gzip.decompress(raw)
                  return raw.decode("utf-8","replace")

          # ===== A. 详情接口 =====
          P("=== A. 公告详情接口 ===")
          REC="https://www.189.cn/wtBusiness/wtservice/nc/recPos/getRecPosInfo.do"
          SAMPLE="570447200001"
          tries = [
            ("search/list.do offerCode", "https://www.189.cn/wtBusiness/wtservice/nc/search/list.do",
              {"type":"wt_sy_bzzx","offerCode":SAMPLE,"provinceCode":"600203","cityCode":""}),
            ("search/list.do id", "https://www.189.cn/wtBusiness/wtservice/nc/search/list.do",
              {"type":"wt_sy_bzzx","id":SAMPLE,"provinceCode":"600203","cityCode":"","pageNo":1,"pageSize":10}),
            ("getRecPosInfo floorType=2", REC, {"shopId":"20001","type":"wt_sy_bzzx","floorType":"2","order":1,"provinceCode":"600203","cityCode":"","offerCode":SAMPLE}),
            ("getRecPosInfo externalOfferCode", REC, {"shopId":"20001","type":"wt_sy_bzzx","floorType":"1","order":1,"provinceCode":"600203","cityCode":"","externalOfferCode":SAMPLE}),
            ("getRecPosInfo detail=1", REC, {"shopId":"20001","type":"wt_sy_bzzx","order":1,"provinceCode":"600203","cityCode":"","detail":1,"offerCode":SAMPLE}),
          ]
          for name,u,b in tries:
              try:
                  r=rpost(u,b)
                  P("  [%s] %s" % (name, json.dumps(r,ensure_ascii=False)[:400]))
              except Exception as e:
                  P("  [%s] ERR %s" % (name,e))
          # 前端 JS 里挖更多路径
          try:
              js=rget("https://www.189.cn/web/assets/index-xdZ1yBwq.js")
              P("  js len=%d" % len(js))
              paths=set()
              for m in re.finditer(r'["\'](/[A-Za-z0-9/_\-\.]*(?:\.do|/notice[A-Za-z0-9/_\-]*))["\']', js):
                  paths.add(m.group(1))
              for m in re.finditer(r'["\'](https://[a-z0-9\.\-]*189\.cn/[A-Za-z0-9/_\-\.]*\.do)["\']', js):
                  paths.add(m.group(1))
              for p in sorted(paths)[:60]:
                  P("  PATH %s" % p)
              # 找 detail 相关
              for m in re.finditer(r'.{120}detail.{160}', js):
                  P("  CTX %s" % m.group(0)[:280]); break
          except Exception as e:
              P("  js ERR %s" % e)
          # GET 详情页
          for u in ["https://www.189.cn/web/notice/detail?offerCode=%s"%SAMPLE,
                    "https://www.189.cn/web/notice/detail?externalOfferCode=%s"%SAMPLE,
                    "https://www.189.cn/web/notice/detail?id=%s"%SAMPLE]:
              try:
                  t=rget(u)
                  P("  GET %s -> len=%d %s" % (u.split('?')[1], len(t), t[:200].replace('\n',' ')))
              except Exception as e:
                  P("  GET %s ERR %s" % (u.split('?')[1], e))

          # ===== B. 山东/河南 provCode 扫描 =====
          P("=== B. provCode 扫描（山东/河南）===")
          KEY=b"telecom_wap_2018"
          API="https://www.189.cn/wapportalweb/wapportalweb/tariffSection.do"
          def tenc(m): return base64.b64encode(AES.new(KEY,AES.MODE_ECB).encrypt(pad(m.encode("utf-8"),16))).decode("utf-8")
          def tcall(fn,rc,retry=2):
              body=tenc(json.dumps({"headerInfo":{"functionCode":fn},"requestContent":rc},ensure_ascii=False))
              req=urllib.request.Request(API,data=body.encode("utf-8"),method="POST",headers={
                  "User-Agent":UA,"Referer":"https://www.189.cn/wapportalweb/rateZone/index.html",
                  "Accept":"application/json, text/plain, */*","Content-Type":"text/plain;charset=UTF-8",
                  "Origin":"https://www.189.cn","x-qd-reqtime":str(int(time.time()*1000))})
              last=None
              for a in range(retry):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e; time.sleep(1.5)
              raise last
          KW=["山东","济南","青岛","烟台","潍坊","淄博","临沂","河南","郑州","洛阳","开封","南阳","新乡"]
          cands=["600106","600107","600108","600109","600110","600111",
                 "600206","600207","600208","600209","600210","600211",
                 "600306","600307","600308","600309","600310",
                 "600407","600408","600409","600410","600411","600412",
                 "600501","600502","600503","600504","600601","600602"]
          for prov in cands:
              try:
                  rc=tcall("tariffSectionHome",{"ticket":"","sessionid":"","provCode":prov}).get("responseContent",{})
                  boards=rc.get("lableOneList") or []
                  sess=rc.get("sessionid")
                  names=[]
                  for b in boards:
                      try:
                          rq=tcall("tariffSectionQuery",{"sessionid":sess,"type":1,"provCode":prov,"lable1Id":b["id"],"lable2Id":""}).get("responseContent",{})
                          for x in (rq.get("zoneTitleList") or []): names.append(str(x.get("name","")))
                      except Exception: pass
                      time.sleep(0.25)
                  blob=" ".join([str(b.get("name","")) for b in boards])+" "+" ".join(names)
                  hits={k:blob.count(k) for k in KW if blob.count(k)}
                  top=sorted(hits.items(),key=lambda kv:-kv[1])[:6]
                  P("%s boards=%d n=%d kw=%s" % (prov,len(boards),len(names),top))
                  if top:
                      P("    sample=%s" % " | ".join(names[:6])[:260])
              except Exception as e:
                  P("%s ERR %s" % (prov,str(e)[:60]))
              time.sleep(0.4)
          txt="\n".join(out)
          tok=os.environ.get("GH_TOKEN"); repo="WoShiYiGeManHuaJia/hunan-tariff-site"; path="logs/tc_probe2.txt"
          H={"Authorization":"token "+tok,"User-Agent":"x","Accept":"application/vnd.github+json"}
          sha=None
          try:
              d=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),headers=H),timeout=30).read())
              sha=d.get("sha")
          except Exception: pass
          pl={"message":"tc probe2","content":base64.b64encode(txt.encode()).decode()}
          if sha: pl["sha"]=sha
          try:
              urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/%s/contents/%s"%(repo,path),data=json.dumps(pl).encode(),headers=H,method="PUT"),timeout=60).read()
              print("WROTE_OK")
          except Exception as e: print("WROTE_FAIL",e)
          PYEOF
