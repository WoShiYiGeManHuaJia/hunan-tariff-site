name: zz-fix-site
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: diag and fix
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          exec > >(tee /tmp/o.txt) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip"
          H="Authorization: Bearer $CF"
          echo "TIME $(date -u '+%F %T UTC')"
          echo "== 项目配置 =="
          curl -sS -m 30 -H "$H" "$API" -o /tmp/proj.json
          python3 -c 'import json;d=json.load(open("/tmp/proj.json"));r=d.get("result",{});print("success",d.get("success"),"subdomain",r.get("subdomain"),"domains",r.get("domains"));print("prod_branch",(r.get("source") or {}).get("config",{}).get("production_branch"));print("build",json.dumps(r.get("build_config") or {},ensure_ascii=False)[:500]);print("latest",json.dumps(r.get("latest_deployment") or {},ensure_ascii=False)[:400])'
          echo "== 具体部署 URL =="
          GOOD=""
          for ID in 56a73d25 8a18f682 836d11e3 d95d8a6c 1c39a81c 6d185efc; do
            C=$(curl -sS -m 30 -o /tmp/b.html -w "%{http_code}" "https://$ID.hnvip.pages.dev/")
            echo "$ID code=$C size=$(wc -c < /tmp/b.html)"
            if [ "$C" = "200" ] && [ -z "$GOOD" ]; then GOOD="$ID"; fi
          done
          echo "GOOD=$GOOD"
          curl -sS -m 30 -H "$H" "$API/deployments" -o /tmp/dep.json
          python3 -c 'import json;d=json.load(open("/tmp/dep.json"));[print(" ",x.get("created_on"),x.get("short_id"),(x.get("latest_stage") or {}).get("name"),(x.get("latest_stage") or {}).get("status")) for x in (d.get("result") or [])[:8]]'
          if [ -n "$GOOD" ]; then
            FULL=$(python3 -c 'import json,sys;d=json.load(open("/tmp/dep.json"));print(next((x.get("id","") for x in d.get("result",[]) if (x.get("short_id") or "")[:8]==sys.argv[1]),""))' "$GOOD")
            echo "full_id=$FULL"
            if [ -n "$FULL" ]; then
              curl -sS -m 30 -X POST -H "$H" -H "Content-Type: application/json" -d '{}' "$API/deployments/$FULL/rollback" -o /tmp/rb.json -w "rollback_http=%{http_code}\n"
              head -c 400 /tmp/rb.json; echo
            fi
          else
            echo "== 无可用部署，触发全新部署 =="
            curl -sS -m 30 -X POST -H "$H" -H "Content-Type: application/json" -d '{"branch":"main"}' "$API/deployments" -o /tmp/nd.json -w "new_http=%{http_code}\n"
            head -c 300 /tmp/nd.json; echo
          fi
          echo "== 等待后复测 =="
          sleep 75
          for U in "https://hnvip.pages.dev/" "https://hnvip.pages.dev/version.json"; do
            printf "%s " "$U"
            curl -sS -m 30 -o /tmp/b2.html -w "code=%{http_code} size=%{size_download}\n" "$U"
            head -c 120 /tmp/b2.html; echo
          done
          echo "== WRITE =="
          B64=$(base64 -w0 /tmp/o.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/zz-fix.txt" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha",""))')
          if [ -n "$SHA" ]; then
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"fix\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-fix.txt" -o /dev/null -w "write=%{http_code}\n"
          else
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"fix\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-fix.txt" -o /dev/null -w "write=%{http_code}\n"
          fi
