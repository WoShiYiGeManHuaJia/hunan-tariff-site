name: zz-final
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 强制部署并核验裸地址
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          exec > >(tee /tmp/o.txt) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip"
          echo "== TIME =="; date -u
          echo "== FORCE DEPLOY =="
          curl -sS -m 25 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d '{"branch":"main"}' "$API/deployments" -o /tmp/n.json
          python3 -c 'import json;d=json.load(open("/tmp/n.json"));print("success",d.get("success"),"id",d.get("result",{}).get("short_id"))'
          echo "== WAIT 110s =="; sleep 110
          echo "== DEPLOY STATE =="
          curl -sS -m 25 -H "Authorization: Bearer $CF" "$API/deployments?per_page=5" -o /tmp/d.json
          python3 -c 'import json;d=json.load(open("/tmp/d.json"));[print(x.get("short_id"),x.get("created_on"),[s.get("name")+":"+str(s.get("status")) for s in x.get("stages",[])][-4:]) for x in d.get("result",[])[:5]]'
          T=$(date +%s)
          echo "== 裸地址 https://hnvip.pages.dev/ （不带任何参数）=="
          curl -sS -m 45 -D /tmp/h1.txt "https://hnvip.pages.dev/" -o /tmp/i1.html
          echo "-- response headers --"
          grep -iE "^(HTTP/|cache-control|pragma|expires|clear-site-data|etag|last-modified|cf-cache|age)" /tmp/h1.txt
          echo "-- body checks --"
          python3 -c 't=open("/tmp/i1.html",encoding="utf8",errors="replace").read();print("bytes",len(t));print("BUILD_VER_g",("BUILD_VER = \"20261107g\"" in t));print("has_docswap",("__docswap" in t));print("has_seccache",("__secCache" in t));print("old_daily_key",("q = \"_d=\"" in t));print("popup_text",("云盘签到已做成本地部署" in t));print("new_link",("2yA8A0WzCYZr3" in t))'
          echo "== version / latest / history =="
          curl -sS -m 30 "https://hnvip.pages.dev/version.json?_t=$T"; echo
          curl -sS -m 30 "https://hnvip.pages.dev/data/latest.json?_t=$T" -o /tmp/l.json
          python3 -c 'import json;d=json.load(open("/tmp/l.json"));print("latest.updated",d.get("updated"),"hunan",d.get("hunan_total"))'
          curl -sS -m 60 "https://hnvip.pages.dev/data/history.json?_t=$T" -o /tmp/h.json
          python3 -c 'import json;h=json.load(open("/tmp/h.json"));print("history.count",len(h),"last",h[-1].get("ts"))'
          echo "== WRITE =="
          B64=$(base64 -w0 /tmp/o.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/zz-final.txt" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha",""))')
          if [ -n "$SHA" ]; then
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"f\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-final.txt" -o /dev/null -w "write=%{http_code}\n"
          else
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"f\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-final.txt" -o /dev/null -w "write=%{http_code}\n"
          fi
