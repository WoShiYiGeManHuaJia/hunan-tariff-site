name: zz-online-probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          exec > >(tee /tmp/probe.txt) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip"
          echo "== TIME =="; date -u
          echo "== PROJECT CONFIG =="
          curl -sS -m 25 -H "Authorization: Bearer $CF" "$API" -o /tmp/proj.json
          python3 -c "import json;d=json.load(open('/tmp/proj.json'));r=d.get('result',{});print('success',d.get('success'));print('production_branch',r.get('production_branch'));print('source',json.dumps(r.get('source'),ensure_ascii=False)[:300]);print('build_config',json.dumps(r.get('build_config'),ensure_ascii=False)[:300]);print('latest',json.dumps(r.get('latest_deployment'),ensure_ascii=False)[:400])"
          echo "== DEPLOYMENTS (20) =="
          curl -sS -m 25 -H "Authorization: Bearer $CF" "$API/deployments?per_page=20" -o /tmp/dep.json
          python3 -c "import json;d=json.load(open('/tmp/dep.json'));print('success',d.get('success'));[print(x.get('created_on'),x.get('short_id'),json.dumps(x.get('latest_stage'),ensure_ascii=False)[:160]) for x in d.get('result',[])[:20]]"
          echo "== TRIGGER DEPLOY =="
          curl -sS -m 25 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d '{"branch":"main"}' "$API/deployments" -o /tmp/newdep.json
          python3 -c "import json;d=json.load(open('/tmp/newdep.json'));print('success',d.get('success'));r=d.get('result',{});print('id',r.get('id'),'short',r.get('short_id'),'stage',json.dumps(r.get('latest_stage'),ensure_ascii=False)[:200]);print('errors',json.dumps(d.get('errors'),ensure_ascii=False)[:300])"
          echo "== WAIT 75s =="; sleep 75
          echo "== ONLINE version =="
          curl -sS -m 30 "https://hnvip.pages.dev/version.json?_t=$(date +%s)"
          echo
          echo "== ONLINE latest =="
          curl -sS -m 30 "https://hnvip.pages.dev/data/latest.json?_t=$(date +%s)" -o /tmp/ol.json
          python3 -c "import json;d=json.load(open('/tmp/ol.json'));print('updated',d.get('updated'),'quanguo',d.get('quanguo_total'),'hunan',d.get('hunan_total'))"
          echo "== ONLINE history =="
          curl -sS -m 45 "https://hnvip.pages.dev/data/history.json?_t=$(date +%s)" -o /tmp/oh.json
          python3 -c "import json;h=json.load(open('/tmp/oh.json'));print('count',len(h),'first',h[0].get('ts'),'last',h[-1].get('ts'))"
          echo "== ONLINE _headers check =="
          curl -sS -m 25 -I "https://hnvip.pages.dev/data/latest.json?_t=$(date +%s)" | python3 -c "import sys;[print(l.strip()) for l in sys.stdin if 'cache-control' in l.lower() or 'HTTP/' in l]"
          echo "== WRITE BACK =="
          B64=$(base64 -w0 /tmp/probe.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/zz-online-probe.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          if [ -n "$SHA" ]; then
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"probe\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-online-probe.txt" -o /dev/null -w "write=%{http_code}\n"
          else
            curl -sS -X PUT -H "Authorization: token $PAT" -H "Content-Type: application/json" -d "{\"message\":\"probe\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/zz-online-probe.txt" -o /dev/null -w "write=%{http_code}\n"
          fi
