name: probe2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 探测
        run: node probe2.js 2>&1 | tee probe2.log
      - name: 回写
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B64=$(base64 -w0 probe2.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/probe2.txt?ref=main" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -d "{\"message\":\"probe2\",\"content\":\"$B64\",\"branch\":\"main\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/probe2.txt" > /dev/null
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -d "{\"message\":\"probe2\",\"content\":\"$B64\",\"branch\":\"main\"}" "https://api.github.com/repos/${{ github.repository }}/contents/probe2.txt" > /dev/null
          fi
