
name: dns-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: resolve
        run: |
          echo "== www CNAME =="
          dig +short www.hnvip.qd.je CNAME
          echo "== www A =="
          dig +short www.hnvip.qd.je A
          echo "== apex A =="
          dig +short hnvip.qd.je A
          echo "== TXT challenge =="
          dig +short _github-pages-challenge-WoShiYiGeManHuaJia.hnvip.qd.je TXT
          echo "== http apex =="
          curl -sS -o /dev/null -w "apex:%{http_code}\n" -L http://hnvip.qd.je/ || true
          echo "== http www =="
          curl -sS -o /dev/null -w "www:%{http_code}\n" -L http://www.hnvip.qd.je/ || true
          echo "== https www =="
          curl -sS -o /dev/null -w "https_www:%{http_code}\n" https://www.hnvip.qd.je/ || true
