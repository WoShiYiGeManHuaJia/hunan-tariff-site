name: dns-check
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: dig A
        run: |
          echo "== A =="
          dig +short hnvip.qd.je A
          echo "== NS =="
          dig +short hnvip.qd.je NS
          echo "== auth NS =="
          dig @dns1.digitalplat.org +short hnvip.qd.je A
          dig @dns2.digitalplat.org +short hnvip.qd.je A
          echo "== curl http =="
          curl -sS -o /dev/null -w "%{http_code}\n" -L --max-time 30 http://hnvip.qd.je/ || true
          echo "== curl https =="
          curl -sS -o /dev/null -w "%{http_code}\n" -L --max-time 30 https://hnvip.qd.je/ || true
          echo "== 8.8.8.8 =="
          dig @8.8.8.8 +short hnvip.qd.je A
          dig @1.1.1.1 +short hnvip.qd.je A
