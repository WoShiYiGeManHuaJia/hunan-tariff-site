name: dnscheck

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS lookup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOM: hnvip.qd.je
        run: |
          echo '' | base64 -d > /tmp/dns.py
          python3 /tmp/dns.py 2>&1 | tee /tmp/dns.log
