
name: dns-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: resolve
        run: |
          {
          echo "time: $(date -u)"
          echo "== www CNAME =="; dig +short www.hnvip.qd.je CNAME
          echo "== www A =="; dig +short www.hnvip.qd.je A
          echo "== apex A =="; dig +short hnvip.qd.je A
          echo "== NS =="; dig +short hnvip.qd.je NS
          echo "== challenge TXT =="; dig +short _github-pages-challenge-WoShiYiGeManHuaJia.hnvip.qd.je TXT
          echo "== http apex =="; curl -sS -o /dev/null -w "apex:%{http_code}\n" -L --max-time 20 http://hnvip.qd.je/ || echo apex:fail
          echo "== http www =="; curl -sS -o /dev/null -w "www:%{http_code}\n" -L --max-time 20 http://www.hnvip.qd.je/ || echo www:fail
          echo "== https www =="; curl -sS -o /dev/null -w "https_www:%{http_code}\n" --max-time 20 https://www.hnvip.qd.je/ || echo https_www:fail
          } > out.txt 2>&1
      - name: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat out.txt)
          gh issue create --repo WoShiYiGeManHuaJia/hunan-tariff-site --title "dns-check $(date -u +%H:%M)" --body "$BODY" || true
