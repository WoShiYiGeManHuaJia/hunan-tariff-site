name: TCANN6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome -q
      - name: 跑电信公告脚本并落盘校验
        run: |
          mkdir -p /tmp/tcout
          PYTHONPATH=pipelines python3 -u pipelines/scripts/announce_fetch.py --tc-dir /tmp/tcout 2>&1 | tee _tcann6_out.txt
          echo "----- RESULT -----" >> _tcann6_out.txt
          python3 -c "
          import json
          d=json.load(open('/tmp/tcout/announce.json',encoding='utf-8'))
          print('updated',d['updated'],'count',d['count'])
          for i,it in enumerate(d['items'],1):
              print(i, it['date'], '|', it['title'][:36], '| summary', len(it.get('summary') or ''), '| content', len(it.get('content') or ''), '| att', len(it.get('attachments') or []))
          " >> _tcann6_out.txt 2>&1
          cat _tcann6_out.txt
      - name: 提交结果
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _tcann6_out.txt
          git commit -q -m "tcann6 out" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
