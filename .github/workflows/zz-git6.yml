name: zz-git6
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: 改用 GitHub 源
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p /tmp/o; O=/tmp/o/out.txt; exec > >(tee -a $O) 2>&1
          ACC=9156c2cae565fdf42d208827b523e47e
          echo "=== 参照 hunan-tariff-site 的 source 配置 ==="
          curl -sS -m 25 -H "Authorization: Bearer $CF" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/changes-in-carrier-pricing" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(json.dumps(d.get('result',{}).get('source'),ensure_ascii=False))
          print('build:',json.dumps(d.get('result',{}).get('build_config'),ensure_ascii=False)[:400])
          "
          echo "=== PATCH hnvip 设为 GitHub 源 ==="
          curl -sS -m 30 -X PATCH -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
            -d '{"source":{"type":"github","config":{"owner":"WoShiYiGeManHuaJia","repo_name":"hunan-tariff-site","production_branch":"main","pr_comments_enabled":true,"deployments_enabled":true}},"build_config":{"build_command":"","destination_dir":"","root_dir":"","watch_paths":[]}}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip" | head -c 600
          echo ""
          echo "=== 触发从 git 部署 ==="
          curl -sS -m 30 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
            -d '{"branch":"main"}' "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/hnvip/deployments" | head -c 500
          echo ""
      - name: 等并验证
        run: |
          sleep 60
          echo "hnvip -> $(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 https://hnvip.pages.dev/ 2>&1)" >> /tmp/o/out.txt
      - name: 提交
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          B64=$(base64 -w0 /tmp/o/out.txt)
          SHA=$(curl -sS -H "Authorization: token $PAT" "https://api.github.com/repos/${{ github.repository }}/contents/git6.txt" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          [ -z "$SHA" ] && curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"git6\",\"content\":\"$B64\"}" "https://api.github.com/repos/${{ github.repository }}/contents/git6.txt" || curl -sS -X PUT -H "Authorization: token $PAT" -d "{\"message\":\"git6\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" "https://api.github.com/repos/${{ github.repository }}/contents/git6.txt"
          echo done
