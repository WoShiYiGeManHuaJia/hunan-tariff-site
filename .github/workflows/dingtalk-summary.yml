name: Tariff Notify
# 汇总推送：钉钉 / 飞书 / 企业微信 / 邮件（配哪个推哪个）

on:
  schedule:
    # ★ 必须排在当日所有抓取完成之后，否则汇总读到的是上一轮数据。
    #   抓取排期（北京时间）：移动 08:47(~30分) / 电信广电 09:17(~35分) /
    #   联通 09:37(~70分，约 10:47 结束)。
    #   此前汇总定在 10:00，联通只跑了 23/70 分钟，
    #   导致用户看到的「最新汇总」实际滞后约 12 小时且从不报错。
    #   现在留足缓冲：早场 11:15、晚场 23:15（晚场联通 21:37 起约 22:47 结束）。
    - cron: "15 3 * * *"     # 北京 11:15
    - cron: "15 15 * * *"    # 北京 23:15
  workflow_dispatch:
    inputs:
      hours:
        description: "统计最近 N 小时"
        default: "24"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 推送汇总（多通道）
        env:
          # 钉钉
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:  ${{ secrets.DINGTALK_SECRET }}
          # 飞书
          FEISHU_WEBHOOK:   ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET:    ${{ secrets.FEISHU_SECRET }}
          # 企业微信机器人
          WECOM_WEBHOOK:    ${{ secrets.WECOM_WEBHOOK }}
          # 邮件
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          MAIL_TO:          ${{ secrets.MAIL_TO }}
          MAIL_FROM:        ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME:   ${{ secrets.MAIL_FROM_NAME }}
          # 通用
          SINCE_HOURS:      ${{ github.event.inputs.hours || '24' }}
          # 仓库未配置 vars 时这里会是空串，必须给默认值
          # （脚本里也做了显式回退，双保险）
          FOCUS_SEC:        ${{ vars.FOCUS_SEC || 'hunan' }}
          SITE_URL:         ${{ vars.SITE_URL || 'https://woshiyigemanhuajia.github.io/hunan-tariff-site/' }}
          SITE_ROOT:        "."
        run: python3 scripts/dingtalk_summary.py
