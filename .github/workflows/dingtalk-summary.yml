name: Tariff Notify
# 汇总推送：钉钉 / 飞书 / 企业微信 / 邮件（配哪个推哪个）

on:
  schedule:
    # ★ 必须排在当日所有抓取完成之后，否则汇总读到的是上一轮数据。
    #   抓取排期（北京时间）：移动 08:47 / 电信广电 09:17 / 联通 09:37。
    #   SCRAPE_MODE=focus 时各省只抓「全网 + 重点两省」，耗时大幅缩短：
    #     移动 ~4 分(08:51) / 电信广电 ~5 分(09:22) / 联通 ~7 分(09:44)
    #   故 10:00 汇总可稳定读到四家当日数据，留约 16 分钟缓冲。
    #   ⚠️ 若把 SCRAPE_MODE 改回 full，联通需 ~70 分钟(10:47 结束)，
    #      届时请把早场改回 11:15，晚场同理（full 晚场约 22:47 结束 → 23:15）。
    - cron: "0 2 * * *"      # 北京 10:00（focus 模式专用）
    - cron: "0 12 * * *"     # 北京 20:00
  workflow_dispatch:
    inputs:
      hours:
        description: "统计最近 N 小时"
        default: "24"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 推送汇总（多通道）
        env:
          # 钉钉
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET:  ${{ secrets.DINGTALK_SECRET }}
          # 飞书
          FEISHU_WEBHOOK:   ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET:    ${{ secrets.FEISHU_SECRET }}
          # 企业微信机器人
          WECOM_WEBHOOK:    ${{ secrets.WECOM_WEBHOOK }}
          # 邮件
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          MAIL_TO:          ${{ secrets.MAIL_TO }}
          MAIL_FROM:        ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME:   ${{ secrets.MAIL_FROM_NAME }}
          # 通用
          SINCE_HOURS:      ${{ github.event.inputs.hours || '24' }}
          # 仓库未配置 vars 时这里会是空串，必须给默认值
          # （脚本里也做了显式回退，双保险）
          FOCUS_SEC:        ${{ vars.FOCUS_SEC || 'hunan' }}
          SITE_URL:         ${{ vars.SITE_URL || 'https://woshiyigemanhuajia.github.io/hunan-tariff-site/' }}
          SITE_ROOT:        "."
        run: python3 scripts/dingtalk_summary.py
