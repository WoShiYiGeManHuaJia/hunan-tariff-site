name: verify-apk
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 从用户实际访问的网址下载并解包校验
        run: |
          mkdir -p vlog
          python3 check.py > vlog/verify.txt 2>&1
          cat vlog/verify.txt
      - name: 保存
        run: |
          git config user.name bot
          git config user.email b@e.com
          git add vlog/ || true
          git diff --cached --quiet || git commit -m "vlog"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break || sleep 5; done
