name: mkshort
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mkshort.yml
      - SHORT_URL.md
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gen short links
        run: |
          set +e
          out="SHORT_URL.md"
          echo "# 资费站短链接（自动生成）" > $out
          echo "" >> $out
          gen() {
            u="$1"
            for api in "https://is.gd/create.php?format=simple&url=$u" "https://v.gd/create.php?format=simple&url=$u" "https://tinyurl.com/api-create.php?url=$u" "https://clck.ru/--?url=$u"; do
              res=$(curl -s -m 25 -A "Mozilla/5.0" "$api" | tr -d '\r\n ')
              case "$res" in
                http*) echo "$res"; return 0;;
              esac
            done
            echo "生成失败"
          }
          echo "## 移动" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/")\`" >> $out
          echo "" >> $out
          echo "## 联通" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/unicom/")\`" >> $out
          echo "" >> $out
          echo "## 电信" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/telecom/")\`" >> $out
          echo "" >> $out
          echo "## 广电" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/gb/")\`" >> $out
          echo "" >> $out
          echo "生成时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $out
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "update short urls" || echo "no change"
          git push
