name: mkshort
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gen shortest link
        run: |
          U="https://woshiyigemanhuajia.github.io/hunan-tariff-site/nav.html"
          out="SHORT.md"
          echo "# 总入口短链" > $out
          echo "" >> $out
          echo "目标: $U" >> $out
          echo "" >> $out
          echo "## 候选短码（按长度排序）" >> $out
          echo "" >> $out
          for sn in hntf hnt zf tf4 tf gd zifei hnzf; do
            res=$(curl -s -m 25 -A "Mozilla/5.0" "https://is.gd/create.php?format=simple&url=$U&shortname=$sn")
            case "$res" in
              http*) echo "- \`$res\` (${#res} 字符)" >> $out ;;
              *) echo "- is.gd/$sn -> 失败: $res" >> $out ;;
            esac
          done
          echo "" >> $out
          r2=$(curl -s -m 25 -A "Mozilla/5.0" "https://tinyurl.com/api-create.php?url=$U&alias=hntf")
          echo "- tinyurl alias: \`$r2\`" >> $out
          r3=$(curl -s -m 25 -A "Mozilla/5.0" "https://v.gd/create.php?format=simple&url=$U")
          echo "- v.gd 随机: \`$r3\`" >> $out
          r4=$(curl -s -m 25 -A "Mozilla/5.0" "https://tinyurl.com/api-create.php?url=$U")
          echo "- tinyurl 随机: \`$r4\`" >> $out
          r5=$(curl -s -m 25 -A "Mozilla/5.0" "https://clck.ru/--?url=$U")
          echo "- clck.ru: \`$r5\`" >> $out
          cat $out
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "gen short link candidates" || echo "no change"
          git push
