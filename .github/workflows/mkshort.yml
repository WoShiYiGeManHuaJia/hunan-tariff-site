name: mkshort
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gen short links
        run: |
          set +e
          out="SHORT_URL.md"
          echo "# 短链接（自动生成）" > $out
          echo "" >> $out
          gen() {
            u="$1"
            for svc in "is.gd|https://is.gd/create.php?format=simple&url=$u" "v.gd|https://v.gd/create.php?format=simple&url=$u" "tinyurl|https://tinyurl.com/api-create.php?url=$u" "clck|https://clck.ru/--?url=$u" "tly|https://t.ly/api/v1/link/shorten"; do
              n="${svc%%|*}"; api="${svc#*|}"
              if [ "$n" = "tly" ]; then
                res=$(curl -s -m 20 -X POST "$api" -H 'Content-Type: application/json' -d "{\"long_url\":\"$u\"}" | sed -n 's/.*"short_url":"\([^"]*\)".*/\1/p')
              else
                res=$(curl -s -m 20 -A "Mozilla/5.0" "$api" | tr -d '\r\n ')
              fi
              case "$res" in
                http*) echo "$res"; return 0;;
              esac
            done
            echo "(生成失败)"
          }
          echo "## 中国移动资费监控" >> $out
          echo "https://woshiyigemanhuajia.github.io/hunan-tariff-site/" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/")\`" >> $out
          echo "" >> $out
          echo "## 中国联通" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/unicom/")\`" >> $out
          echo "" >> $out
          echo "## 中国电信" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/telecom/")\`" >> $out
          echo "" >> $out
          echo "## 中国广电" >> $out
          echo "\`$(gen "https://woshiyigemanhuajia.github.io/hunan-tariff-site/gb/")\`" >> $out
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "update short urls" || echo "no change"
          git push
