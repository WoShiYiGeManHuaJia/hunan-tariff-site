<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营商资费合集 · 移动+联通</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0d1017;color:#e8ecf3;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 16px;border-bottom:1px solid #232a3a;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#121826}
  header h1{font-size:16px;letter-spacing:.5px}
  header h1 b{color:#ffb347}
  .switch{display:flex;gap:10px}
  .switch a{padding:8px 22px;border-radius:24px;font-size:14px;font-weight:700;text-decoration:none;color:#fff;display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:all .18s ease;border:2px solid transparent}
  .switch a .dot{width:9px;height:9px;border-radius:50%;background:#fff;flex:none}
  .switch a.m{background:linear-gradient(135deg,#0d8bec,#07568f)}
  .switch a.u{background:linear-gradient(135deg,#ff3140,#b3020e)}
  .switch a:hover{transform:translateY(-2px)}
  .switch a.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.16),0 5px 16px rgba(0,0,0,.4)}
  .linkbox{display:flex;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid #232a3a;font-size:12.5px;color:#7f8ba3;flex-wrap:wrap;background:#0f1521}
  .linkbox .lb{color:#9fb0cc;font-weight:600;margin-right:2px}
  .linkbox a{color:#5ec6f8;text-decoration:none;padding:2px 10px;border:1px solid #2a3549;border-radius:14px;background:#161e2e}
  .linkbox a:hover{border-color:#5ec6f8}
  .linkbox a.u{color:#ffb9bf;border-color:#4a2a30}
  .linkbox a.u:hover{border-color:#ff7180}
  main{flex:1;overflow:auto;background:#0d1017}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<header>
  <h1>运营商资费合集 · <b>移动 · 联通</b></h1>
  <nav class="switch" id="switch">
    <a href="#mobile" data-href="../index.html" data-name="移动" class="m"><span class="dot"></span>中国移动</a>
    <a href="#unicom" data-href="../unicom/" data-name="联通" class="u"><span class="dot"></span>中国联通</a>
  </nav>
</header>
<div class="linkbox">
  <span class="lb">独立链接：</span>
  <a href="../index.html" target="_blank" rel="noopener">移动站（独立）</a>
  <a class="u" href="../unicom/" target="_blank" rel="noopener">联通站（独立）</a>
  <span style="opacity:.6">— 上方合集页签为两站整合入口，各自独立链接照常可用</span>
</div>
<main><iframe id="frame" src="../index.html"></iframe></main>
<script>
  var frame = document.getElementById("frame");
  var map = {"#mobile":"../index.html","#unicom":"../unicom/"};
  function pick(hash){
    var href = map[hash] || "../index.html";
    var name = {"#mobile":"移动","#unicom":"联通"}[hash] || "移动";
    frame.src = href;
    document.querySelectorAll("#switch a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("href")===hash); });
    document.title = name + " · 运营商资费合集";
  }
  window.addEventListener("hashchange", function(){ pick(location.hash); });
  pick(location.hash || "#mobile");
</script>
</body>
</html>
